  /api/batches:
    get:
      tags:
        - Batches
      summary: List batches with pagination
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Offset page number. Ignored when cursor is provided.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque keyset cursor from a previous response's meta.nextCursor. Preferred over page for large datasets — it never deep-skips.
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search in name or description
      responses:
        "200":
          description: Paginated batch list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBatches"
              example:
                success: true
                data:
                  - id: batch_7710a9c82e
                    name: August Payroll Distribution
                    status: COMPLETED
                    totalAmount: 6050
                    recipientCount: 2
                    createdAt: "2026-08-26T18:30:00.000Z"
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  hasMore: false
                  nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Batches
      summary: Create a batch payment (idempotent)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 255
          description: Per-user key that makes submission idempotent. Re-sending the same key returns the already-created batch (200) instead of double sending; if the first attempt crashed before inserting child payments, a retry resumes only the missing ones. An equivalent `idempotencyKey` body field is accepted when no header is sent, but the header takes precedence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
            example:
              name: August Payroll Distribution
              description: Monthly contractor payouts
              sourceAccountId: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
              recipients:
                - address: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                  amount: 3200
                  assetCode: USDC
                  memo: PAYROLL-ENG-01
                - address: GCKIK6UJJ5GDRV47Z2P3N2V376P5Y4G6Z66N2BJZP3M2M2N2M2N2M2N2
                  amount: 2850
                  assetCode: USDC
                  memo: PAYROLL-ENG-02
      responses:
        "200":
          description: Already-processed batch returned for a replayed idempotency key (meta.deduplicated is true)
          content:
            application/json:
              example:
                success: true
                data:
                  id: batch_7710a9c82e
                  name: August Payroll Distribution
                  status: CREATED
                  totalAmount: 6050
                  recipientCount: 2
                  createdAt: "2026-08-26T18:30:00.000Z"
                meta:
                  deduplicated: true
        "201":
          description: Batch created with child payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/BatchResponse"
              example:
                success: true
                data:
                  id: batch_7710a9c82e
                  name: August Payroll Distribution
                  status: CREATED
                  totalAmount: 6050
                  recipientCount: 2
                  createdAt: "2026-08-26T18:30:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/batches/{id}:
    get:
      tags:
