name: "🐳 Docker Smoke Test"

# Issues #731, #1300 — the Dockerfile is one of the supported self-hosted
# deployment paths (docs/DEPLOYMENT.md, docker-compose.yml).
#
# Multi-architecture support:
# Builds and tests both linux/amd64 and linux/arm64 using Docker Buildx and
# QEMU emulation. Proves both architectures pass container startup health checks
# and produces unified multi-arch Docker manifests.
# The BuildKit GHA cache keeps it from dominating CI runtime.

on:
  pull_request:
    branches: [main, integration/staging]
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "docker-compose.yml"
      - "scripts/check-node.mjs"
      - "prisma/schema.prisma"
      - ".github/workflows/docker-smoke.yml"

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: "🐳 Docker build & smoke (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        # Needed on the host to run `prisma db push` against the compose
        # database; `.nvmrc` also satisfies the repo's preinstall check.
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (${{ matrix.platform }})
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ophirpay:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ophirpay:smoke-${{ matrix.arch }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Start backing services
        run: docker compose -f docker-compose.yml up -d db redis

      - name: Create the schema in the compose database
        run: |
          npm ci
          npx --yes wait-on tcp:5432 --timeout 60000
          DATABASE_URL=postgresql://ophirpay:ophirpay@127.0.0.1:5432/ophirpay \
            npx prisma db push --skip-generate

      - name: Smoke test the container
        run: |
          docker run -d --rm --name app-smoke \
            --platform ${{ matrix.platform }} \
            --network host \
            -e DATABASE_URL=postgresql://ophirpay:ophirpay@127.0.0.1:5432/ophirpay \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e HOSTNAME=0.0.0.0 \
            -e AUTH_SECRET=ci-docker-smoke-secret-not-for-production \
            -e NEXT_PUBLIC_CONTRACT_ID=CCQGGUJRRVXMHNEX2RYPODGJE2YRMYY4Y7A3KTJH3QP2LWZLTCOPRPET \
            -e NEXT_PUBLIC_EMITTER_CONTRACT_ID=CDAVU2XJ7C2Y52GRJZKRG3HDI7AJ2K2FHAFH5FPDTSUQAV7XNBQNNVAN \
            ophirpay:smoke-${{ matrix.arch }}

          status=""
          for _ in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$status" = "200" ]; then
              echo "✅ /api/health returned 200 on ${{ matrix.platform }}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::/api/health did not return 200 on ${{ matrix.platform }} (last status: ${status:-<none>})"
          docker logs app-smoke
          exit 1

      - name: Verify the image's HEALTHCHECK reports a health status (issue #738)
        # The acceptance criterion is that `docker inspect` reports a health
        # status for the container — i.e. the Dockerfile's HEALTHCHECK is
        # actually wired, not just present. The probe targets the liveness
        # endpoint, so this passes even when a dependency is unreachable.
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}<none>{{end}}' \
              app-smoke 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "✅ docker inspect reports health status: ${status} on ${{ matrix.platform }}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Container never became healthy on ${{ matrix.platform }} (last status: ${status:-<none>})"
          docker inspect --format '{{json .State.Health}}' app-smoke || true
          docker logs app-smoke
          exit 1

  docker-multiarch-manifest:
    name: "🐳 Multi-arch Docker manifest build (amd64 + arm64)"
    runs-on: ubuntu-latest
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch manifest
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ophirpay:latest
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=multiarch
