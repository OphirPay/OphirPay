name: "🏷️ Meta — PR Labeler"

on:
  # `pull_request_target` (not `pull_request`) so the workflow runs with a
  # token that has `pull-requests: write` even for pull requests from forks.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-labeler:
    name: "🏷️ Meta — PR Labeler"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Checkout the base branch (main) so the labeler reads the trusted
      # `.github/labeler.yml` rather than one from an untrusted PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
