version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ophirpay:ophirpay@db:5432/ophirpay
      - NODE_ENV=development
      # Redis-backed rate limiting over TCP (Node runtime).
      # NOTE: the global limiter in src/proxy.ts runs on the Edge runtime and
      # cannot use this TCP client, so in a multi-replica deployment it stays
      # per-instance. For a *globally* shared limit, point REDIS_URL at an
      # Upstash-compatible https:// REST endpoint instead (see .env.example).
      # With a single app container (as here) the redis:// form is sufficient.
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ── Liveness (issue #738) ──────────────────────────────────
    # The image already ships a HEALTHCHECK (see Dockerfile) that probes
    # GET /api/health/live — no shell, no curl, just the bundled `node`. It is
    # restated here so `docker compose up` shows the app becoming healthy, and
    # so the timings are visible/tunable next to the db + redis healthchecks.
    #
    # Liveness only asks "is the process serving?". Dependency-aware readiness
    # is GET /api/health (503 while the DB is unreachable) and is deliberately
    # NOT used here: a Postgres blip must not flip this container to unhealthy
    # and restart it. Kubernetes wires the two probes separately — see
    # k8s/deployment.yaml and docs/DEPLOYMENT.md.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ophirpay
      POSTGRES_PASSWORD: ophirpay
      POSTGRES_DB: ophirpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ophirpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
