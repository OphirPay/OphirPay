name: OphirPay CI/CD — 15 Jobs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# ── Global Concurrency — cancel stale runs on same PR ────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. LINT — ESLint with zero tolerance
  # ══════════════════════════════════════════════════════════════
  lint:
    name: "1️⃣ Lint — ESLint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - run: npx next lint --max-warnings 0

  # ══════════════════════════════════════════════════════════════
  # 2. TYPECHECK — TypeScript strict type-checking
  # ══════════════════════════════════════════════════════════════
  typecheck:
    name: "2️⃣ TypeCheck — tsc"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - run: npx tsc --noEmit

  # ══════════════════════════════════════════════════════════════
  # 3. UNIT TESTS — Vitest (68 frontend tests)
  # ══════════════════════════════════════════════════════════════
  unit-tests:
    name: "3️⃣ Unit Tests — Vitest"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --reporter=verbose

  # ══════════════════════════════════════════════════════════════
  # 4. TEST COVERAGE — Vitest coverage with thresholds
  # ══════════════════════════════════════════════════════════════
  test-coverage:
    name: "4️⃣ Coverage — Vitest"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --coverage --reporter=verbose
      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # 5. CONTRACT WASM BUILD — Build both Soroban contracts
  # ══════════════════════════════════════════════════════════════
  contract-wasm:
    name: "5️⃣ Contracts — WASM Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Soroban SDK deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/ophirpay/target
            contracts/emitter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build OphirPay contract
        run: cd contracts/ophirpay && cargo build --target wasm32-unknown-unknown --release
      - name: Build Emitter contract
        run: cd contracts/emitter && cargo build --target wasm32-unknown-unknown --release
      - name: Verify WASM artifacts
        run: |
          ls -lh contracts/ophirpay/target/wasm32-unknown-unknown/release/*.wasm
          ls -lh contracts/emitter/target/wasm32-unknown-unknown/release/*.wasm
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contract-wasm
          path: |
            contracts/ophirpay/target/wasm32-unknown-unknown/release/*.wasm
            contracts/emitter/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # 6. NEXT.JS BUILD — Production build verification
  # ══════════════════════════════════════════════════════════════
  next-build:
    name: "6️⃣ Build — Next.js"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Verify build output
        run: |
          test -d .next && echo "✅ .next directory exists"
          test -f .next/BUILD_ID && echo "✅ BUILD_ID exists"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # 7. E2E — Chromium
  # ══════════════════════════════════════════════════════════════
  e2e-chromium:
    name: "7️⃣ E2E — Chromium"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [next-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-chromium
          path: playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # 8. E2E — Firefox
  # ══════════════════════════════════════════════════════════════
  e2e-firefox:
    name: "8️⃣ E2E — Firefox"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [next-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=firefox
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-firefox
          path: playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # 9. PRISMA VALIDATE — Schema integrity + generate
  # ══════════════════════════════════════════════════════════════
  prisma-validate:
    name: "9️⃣ Prisma — Validate Schema"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Check for drift (schema vs migrations)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/dummy 2>&1 || true

  # ══════════════════════════════════════════════════════════════
  # 10. DOCKER BUILD — Build & validate Docker image
  # ══════════════════════════════════════════════════════════════
  docker-build:
    name: "🔟 Docker — Build Image"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ophirpay:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image runs
        run: |
          docker run --rm ophirpay:ci-${{ github.sha }} node -e "console.log('Container OK')"

  # ══════════════════════════════════════════════════════════════
  # 11. K8S VALIDATE — kubeconform on manifests
  # ══════════════════════════════════════════════════════════════
  k8s-validate:
    name: "1️⃣1️⃣ K8s — Validate Manifests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: kubeconform -summary -strict k8s/
      - name: Validate with k8s schema
        run: kubeconform -schema-location default -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json' -summary k8s/ 2>&1 || true

  # ══════════════════════════════════════════════════════════════
  # 12. HELM LINT — Helm chart validation
  # ══════════════════════════════════════════════════════════════
  helm-lint:
    name: "1️⃣2️⃣ Helm — Lint Chart"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest 2>/dev/null || true
      - name: Lint Helm chart
        run: helm lint helm/ophirpay --strict
      - name: Template rendering check
        run: |
          helm template ophirpay helm/ophirpay \
            --set image.tag=ci-test \
            --set ingress.enabled=false \
            > /tmp/rendered.yaml && \
            echo "✅ Helm chart renders successfully ($(wc -l < /tmp/rendered.yaml) lines)"

  # ══════════════════════════════════════════════════════════════
  # 13. SECRET SCAN — Gitleaks to detect committed secrets
  # ══════════════════════════════════════════════════════════════
  secret-scan:
    name: "1️⃣3️⃣ Secrets — Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════
  # 14. DEPENDENCY AUDIT — npm audit for vulnerabilities
  # ══════════════════════════════════════════════════════════════
  dependency-audit:
    name: "1️⃣4️⃣ Audit — npm"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # Don't block PRs, just surface warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - name: npm audit (production deps only, no fix)
        run: npm audit --omit=dev --audit-level=high 2>&1 || true
      - name: npm audit (all deps, report only)
        run: npm audit --audit-level=critical 2>&1 || true

  # ══════════════════════════════════════════════════════════════
  # 15. PR LABELER — Auto-label PRs by changed paths
  # ══════════════════════════════════════════════════════════════
  pr-labeler:
    name: "1️⃣5️⃣ PR — Auto Label"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
