[package]
name = "ophirpay-emitter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=27.0.5"

[dev-dependencies]
soroban-sdk = { version = "=27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
