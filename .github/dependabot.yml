version: 2

# Issue #732 & #1415 — keep dependency updates flowing without drowning reviewers.
#
# Every ecosystem the repo actually pins is covered: the root npm lockfile,
# both Cargo.lock files (contracts/ophirpay, contracts/emitter) and the pinned
# GitHub Actions. Minor/patch bumps are grouped to reduce PR fatigue:
#   - npm: `react-ecosystem`, `dev-tools`, and `utilities`
#   - cargo: `soroban-sdk` and `rust-tooling`
#   - github-actions: single monthly update PR
# Major bumps still arrive on their own for individual review.
# Security updates remain individual high-priority PRs.
#
# See CONTRIBUTING.md → "Dependency Updates" for the review flow.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "next*"
          - "@next/*"
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "eslint*"
          - "@eslint*"
          - "prettier*"
          - "vitest*"
          - "@vitest*"
          - "playwright*"
          - "@playwright*"
          - "@axe-core/playwright*"
          - "@testing-library/*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"
      utilities:
        patterns:
          - "zod*"
          - "date-fns*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/ophirpay"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-sdk*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "proptest*"
          - "*"
        exclude-patterns:
          - "soroban-sdk*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/emitter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-sdk*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "soroban-sdk*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
