# OphirPay — Prometheus alert rules
# Prometheus evaluates these rules; configure Alertmanager separately to route
# alerts to PagerDuty, Slack, or another receiver.

groups:
  - name: app_critical
    interval: 30s
    rules:
      # ── Payment Processing Alerts ────────────────────────────

      - alert: PaymentProcessingLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(ophirpay_endpoint_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          component: payments
        annotations:
          summary: "Payment processing latency > 30s (p95)"
          description: |
            P95 payment processing time is {{ $value }}s. Check Stellar RPC
            and database performance.

      # ── Webhook Delivery Alerts ──────────────────────────────

      - alert: WebhookDeliveryFailureRateHigh
        expr: |
          sum(rate(ophirpay_delivery_final_outcomes_total{delivery_type="webhook",final_outcome="failure"}[15m])) /
          sum(rate(ophirpay_delivery_final_outcomes_total{delivery_type="webhook"}[15m])) > 0.25
        for: 10m
        labels:
          severity: warning
          component: webhooks
        annotations:
          summary: "Webhook delivery failure rate > 25%"
          description: |
            {{ $value | humanizePercentage }} of webhook deliveries have ended
            in failure for at least 10 minutes. Check subscriber endpoints and
            retry attempt distribution.

      # ── API Health Alerts ────────────────────────────────────

      - alert: ApiHighErrorRate
        expr: |
          rate(ophirpay_endpoint_errors_total[5m]) /
          rate(ophirpay_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API error rate > 5%"
          description: |
            OphirPay API is returning errors at {{ $value | humanizePercentage }}.
            Check logs for root cause.

      - alert: ApiDown
        expr: up{job="ophirpay"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "OphirPay API is down"
          description: |
            The OphirPay metrics endpoint is not responding to Prometheus scrapes.
            Instance: {{ $labels.instance }}.

      # ── Soroban RPC Failover Alerts (issue #820) ─────────────

      - alert: RpcFailoverDegraded
        expr: ophirpay_rpc_failover_active == 1
        for: 2m
        labels:
          severity: warning
          component: rpc
        annotations:
          summary: "Soroban RPC running on a non-primary endpoint"
          description: |
            OphirPay has been serving Soroban RPC traffic from a fallback
            endpoint ({{ $labels.endpoint }}) for more than 2 minutes.
            Failover count: {{ with printf "ophirpay_rpc_failover_total" | query }}
            {{ . | first | value }}{{ end }}. Check the upstream provider
            status and the rpcFailover block of GET /api/health.

      - alert: RpcFailoverFrequent
        expr: increase(ophirpay_rpc_failover_total[30m]) >= 3
        for: 5m
        labels:
          severity: warning
          component: rpc
        annotations:
          summary: "Soroban RPC flapping between endpoints"
          description: |
            {{ printf "%.0f" $value }} failovers in the last 30 minutes — the
            primary endpoint is unstable. Verify the primary provider and the
            probe results logged by the failover module.

      # ── Critical SLI Alerts (issue #1412) ────────────────────

      - alert: OphirPayWebhookHighFailureRate
        expr: |
          (
            rate(ophirpay_webhooks_failed_total[5m]) /
            clamp_min(rate(ophirpay_webhooks_delivered_total[5m]) + rate(ophirpay_webhooks_failed_total[5m]), 1e-9)
          ) > 0.10
        for: 5m
        labels:
          severity: critical
          component: webhooks
          sli: webhook_delivery_success_ratio
        annotations:
          summary: "OphirPay webhook failure rate > 10% over 5m"
          description: |
            Webhook failure ratio is {{ $value | humanizePercentage }} over the last 5 minutes
            (threshold: 10%). Inspect dead-lettered webhook events, subscriber endpoint reachability,
            and HMAC signing configuration.
          runbook_url: "https://github.com/OphirPay/OphirPay/blob/main/docs/TROUBLESHOOTING.md#ophirpaywebhookhighfailurerate"

      - alert: OphirPayRpcProviderDegraded
        expr: increase(ophirpay_rpc_failover_total[15m]) > 3
        for: 2m
        labels:
          severity: warning
          component: rpc
          sli: soroban_rpc_availability
        annotations:
          summary: "Soroban RPC provider degraded (> 3 failovers in 15m)"
          description: |
            Soroban RPC failover has triggered {{ printf "%.0f" $value }} times in the last 15 minutes
            (threshold: > 3). Primary RPC node is experiencing error spikes or timeouts; verify
            NEXT_PUBLIC_STELLAR_RPC_URL and fallback RPC health.
          runbook_url: "https://github.com/OphirPay/OphirPay/blob/main/docs/TROUBLESHOOTING.md#ophirpayrpcproviderdegraded"

      - alert: OphirPayDatabasePoolExhaustion
        expr: |
          (
            histogram_quantile(0.95, sum(rate(ophirpay_db_query_duration_seconds_bucket[5m])) by (le)) > 2.0
          ) or (
            (rate(ophirpay_db_query_duration_seconds_sum[5m]) / clamp_min(rate(ophirpay_db_query_duration_seconds_count[5m]), 1e-9)) > 2.0
          )
        for: 5m
        labels:
          severity: critical
          component: database
          sli: database_query_latency_p95
        annotations:
          summary: "Database query p95 latency > 2.0s over 5m (pool exhaustion risk)"
          description: |
            Database query latency is {{ printf "%.2f" $value }}s over the last 5 minutes
            (threshold: 2.0s). Check PostgreSQL connection pool saturation, PgBouncer queueing,
            and long-running transactions.
          runbook_url: "https://github.com/OphirPay/OphirPay/blob/main/docs/TROUBLESHOOTING.md#ophirpaydatabasepoolexhaustion"

