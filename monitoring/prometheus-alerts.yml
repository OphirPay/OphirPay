- alert: RPCDegradedFallbackUsage
  expr: |
    (rpc_active_endpoint{endpoint=~"fallback.*|secondary.*"} == 1)
    and
    (time() - rpc_failover_count > 300)
  for: 5m
  labels:
    severity: warning
    category: rpc
  annotations:
    summary: "RPC running on degraded fallback for {{ $value }} minutes"
    description: |
      The application has been using a non-primary RPC endpoint ({{ $labels.endpoint }})
      for {{ $value | humanizeDuration }}. This may indicate an upstream issue.
      Current failover count: {{ $labels.failover_count }}
      Last failure: {{ $labels.last_failure_reason }}
    runbook_url: "https://github.com/OphirPay/OphirPay/blob/integration/staging/docs/alerts/rpc-fallback.md"

- alert: RPCFailoverSpike
  expr: |
    increase(rpc_failover_count[5m]) > 3
  for: 5m
  labels:
    severity: critical
    category: rpc
  annotations:
    summary: "Rapid RPC failovers detected"
    description: |
      The application experienced {{ $value }} failovers in the last 5 minutes.
      Current endpoint: {{ $labels.endpoint }}
      Last failure: {{ $labels.last_failure_reason }}
    runbook_url: "https://github.com/OphirPay/OphirPay/blob/integration/staging/docs/alerts/rpc-failover.md"
