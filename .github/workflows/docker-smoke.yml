name: "🐳 Docker Smoke Test"

# Issue #731 — the Dockerfile is one of the supported self-hosted deployment
# paths (docs/DEPLOYMENT.md, docker-compose.yml), but no workflow built it. It
# is also unusually sensitive: it must use Debian rather than Alpine because
# Tailwind v4's native binaries crash on musl, and it disables the Puppeteer
# download to stay hermetic. A dependency, base-image or Next output-mode
# change could therefore ship a broken image and only be found by a user.
#
# This job builds the image on PRs that can affect it (without pushing) and
# proves the running container answers GET /api/health with 200. The BuildKit
# GHA cache keeps it from dominating CI runtime.

on:
  pull_request:
    branches: [main, integration/staging]
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "docker-compose.yml"
      - "scripts/check-node.mjs"

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: "🐳 Docker build & smoke test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        # Needed on the host to run `prisma db push` against the compose
        # database; `.nvmrc` also satisfies the repo's preinstall check.
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build the image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: ophirpay:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backing services
        run: docker compose -f docker-compose.yml up -d db redis

      - name: Create the schema in the compose database
        run: |
          npm ci
          npx --yes wait-on tcp:5432 --timeout 60000
          DATABASE_URL=postgresql://ophirpay:ophirpay@127.0.0.1:5432/ophirpay \
            npx prisma db push --skip-generate

      - name: Smoke test the container
        run: |
          docker run -d --rm --name app-smoke \
            --network host \
            -e DATABASE_URL=postgresql://ophirpay:ophirpay@127.0.0.1:5432/ophirpay \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e HOSTNAME=0.0.0.0 \
            -e AUTH_SECRET=ci-docker-smoke-secret-not-for-production \
            -e NEXT_PUBLIC_CONTRACT_ID=CCQGGUJRRVXMHNEX2RYPODGJE2YRMYY4Y7A3KTJH3QP2LWZLTCOPRPET \
            -e NEXT_PUBLIC_EMITTER_CONTRACT_ID=CDAVU2XJ7C2Y52GRJZKRG3HDI7AJ2K2FHAFH5FPDTSUQAV7XNBQNNVAN \
            ophirpay:smoke

          status=""
          for _ in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$status" = "200" ]; then
              echo "✅ /api/health returned 200"
              exit 0
            fi
            sleep 1
          done

          echo "::error::/api/health did not return 200 (last status: ${status:-<none>})"
          docker logs app-smoke
          exit 1

      - name: Verify the image's HEALTHCHECK reports a health status (issue #738)
        # The acceptance criterion is that `docker inspect` reports a health
        # status for the container — i.e. the Dockerfile's HEALTHCHECK is
        # actually wired, not just present. The probe targets the liveness
        # endpoint, so this passes even when a dependency is unreachable.
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}<none>{{end}}' \
              app-smoke 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "✅ docker inspect reports health status: ${status}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Container never became healthy (last status: ${status:-<none>})"
          docker inspect --format '{{json .State.Health}}' app-smoke || true
          docker logs app-smoke
          exit 1
