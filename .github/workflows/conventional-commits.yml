name: "📝 Conventional Commits"

on:
  pull_request:
    branches: [main, integration/staging]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# ── Global Concurrency — cancel stale runs on same PR ────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for commit range

      - name: Validate all commit messages in PR
        if: github.event.pull_request.head.ref != 'integration/staging'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false
