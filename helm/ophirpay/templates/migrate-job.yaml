{{- if or (not (hasKey .Values "migrations")) .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ophirpay.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ophirpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "ophirpay.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ophirpay.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: prisma-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.migratorTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: {{ include "ophirpay.fullname" . }}-config
            - secretRef:
                name: {{ include "ophirpay.fullname" . }}-secrets
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
