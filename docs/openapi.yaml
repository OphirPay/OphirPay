openapi: 3.1.0
info:
  title: OphirPay API
  description: |
    REST API for the OphirPay Stellar payment platform — batch payments,
    escrow, recurring payments, webhook delivery, multisig governance,
    and real-time event streaming.

    **Authentication** — two modes:
    - `Authorization: Bearer <api-key>` (recommended)
    - `X-API-Key: <api-key>`

    API keys are generated at `POST /api/keys` and shown only once.

    **Conventions** — see [docs/API_GUIDE.md](./API_GUIDE.md) for the
    endpoint conventions: file structure, Zod validation, error handling,
    auth usage, the response envelope, and rate limiting.
  version: 0.1.0
  contact:
    name: OphirPay Team
  license:
    name: MIT
    url: https://github.com/ophirpay/ophirpay/blob/main/LICENSE
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.ophirpay.com
    description: Production
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: Payments
    description: Individual payment operations
  - name: Batches
    description: Batch payment operations (authenticated)
  - name: Recurring
    description: Recurring / subscription payment management
  - name: Payment Requests
    description: Payment link / request creation
  - name: Webhooks
    description: Outgoing webhook registration (authenticated)
  - name: API Keys
    description: API key generation and revocation (authenticated)
  - name: Multisig
    description: Multisig configuration, proposals, approvals (on-chain)
  - name: Governance
    description: DAO-governed proposals and voting (on-chain)
  - name: Analytics
    description: Aggregated payment metrics
  - name: Refunds
    description: Refund tracking and analytics
  - name: Hooks
    description: Notification hook registry
  - name: Audit Log
    description: Contract audit log (authenticated)
  - name: Events
    description: Server-Sent Events stream for real-time payments
  - name: Health
    description: Service health and readiness checks
  - name: Metrics
    description: Prometheus metrics endpoint
  - name: Escrows
    description: On-chain escrow accounts (authenticated)
  - name: Streams
    description: On-chain payment streams (authenticated)
  - name: Timelock
    description: Timelocked administrative actions (on-chain)
  - name: RBAC
    description: Role-based access control lookups (on-chain)
  - name: Fee Config
    description: Fee configuration and history (on-chain)
  - name: Policy Versions
    description: Fee and multisig config version history (on-chain)
  - name: Contracts
    description: Contract deployment info and version
  - name: Stats
    description: Aggregate on-chain contract statistics
  - name: Session
    description: Wallet session issuance and revocation
paths:
  /api/payments:
    get:
      tags:
        - Payments
      summary: List payments
      description: |
        Lists the authenticated user's payments, newest first
        (`createdAt DESC, id DESC`).

        Two pagination modes:

        - **Keyset (default)** — pass `limit` and, for subsequent pages, the
          opaque `cursor` returned in `meta.nextCursor`. Rows are fetched with
          `take = limit + 1` to compute `hasMore`, so deep pages cost O(limit)
          and ordering is stable under concurrent inserts. Set
          `includeTotal=true` to also get `meta.total` (an expensive COUNT —
          opt in only when you need it).
        - **Offset (legacy)** — pass `page` + `limit` to get `meta` with
          `page`, `limit`, `total`, `totalPages`, `hasNext`, `hasPrev`.

        `cursor` and `page` are mutually exclusive (400 if both provided).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Offset page number. Ignored when cursor is provided.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque keyset cursor from a previous response's meta.nextCursor. Preferred over page for large datasets — it never deep-skips.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - CREATED
              - PENDING
              - COMPLETED
              - FAILED
              - CANCELLED
        - name: search
          in: query
          schema:
            type: string
          description: Search in description, memo, or transaction hash
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
          description: |
            Admin/debug opt-in: also return soft-deleted rows. Still scoped to the authenticated user — soft-deleted rows are hidden by default.
      responses:
        "200":
          description: Paginated payment list (keyset or offset mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPayments"
              example:
                data:
                  - id: pay_98234ab1c09d
                    amount: 150
                    assetCode: USDC
                    assetIssuer: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                    description: "Consulting invoice payout #0881"
                    memo: INV-2026-001
                    status: COMPLETED
                    transactionHash: 9b12a84efc713b194d3f5481d9f8e4c3a2105e6b7d8c9a0f1e2d3c4b5a6f7e8d
                    sourceAccountId: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                    userId: usr_01hv89q7a4mpx3n
                    batchId: null
                    createdAt: "2026-08-26T18:15:00.000Z"
                    completedAt: "2026-08-26T18:15:04.000Z"
                    errorMessage: null
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  totalPages: 1
                  hasMore: false
                  nextCursor: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Payments
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            example:
              amount: 150
              sourceAccountId: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
              destAddress: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
              assetCode: USDC
              assetIssuer: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
              description: "Consulting invoice payout #0881"
              memo: INV-2026-001
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
              example:
                id: pay_98234ab1c09d
                amount: 150
                assetCode: USDC
                assetIssuer: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                description: "Consulting invoice payout #0881"
                memo: INV-2026-001
                status: PENDING
                transactionHash: null
                sourceAccountId: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                userId: usr_01hv89q7a4mpx3n
                batchId: null
                createdAt: "2026-08-26T18:15:00.000Z"
                completedAt: null
                errorMessage: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/payments/{id}:
    get:
      tags:
        - Payments
      summary: Get a payment by ID
      description: Soft-deleted payments return 404, consistent with list queries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
              example:
                id: pay_98234ab1c09d
                amount: 150
                assetCode: USDC
                assetIssuer: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                description: "Consulting invoice payout #0881"
                memo: INV-2026-001
                status: COMPLETED
                transactionHash: 9b12a84efc713b194d3f5481d9f8e4c3a2105e6b7d8c9a0f1e2d3c4b5a6f7e8d
                sourceAccountId: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                userId: usr_01hv89q7a4mpx3n
                batchId: null
                createdAt: "2026-08-26T18:15:00.000Z"
                completedAt: "2026-08-26T18:15:04.000Z"
                errorMessage: null
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Payments
      summary: Update payment status or metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - CREATED
                    - PENDING
                    - COMPLETED
                    - FAILED
                    - CANCELLED
                description:
                  type: string
                memo:
                  type: string
            example:
              status: COMPLETED
              description: Updated invoice description
              memo: INV-2026-001
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              example:
                success: true
                data:
                  id: pay_98234ab1c09d
                  status: COMPLETED
                  description: Updated invoice description
                  memo: INV-2026-001
                  updatedAt: "2026-08-26T18:25:00.000Z"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Payments
      summary: Soft-delete a payment
      description: |
        Marks the payment as deleted (sets `deletedAt`) instead of removing the row, so audit trails and analytics survive. The row is hidden from lists and behaves like it doesn't exist (404) for GET/PATCH afterwards.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment soft-deleted
          content:
            application/json:
              example:
                success: true
                data:
                  id: pay_98234ab1c09d
                  deleted: true
                  deletedAt: "2026-08-26T18:30:00.000Z"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/payments/retry:
    post:
      tags:
        - Payments
      summary: Retry a failed payment
      description: |
        Retries a failed payment in place: the original amount, recipient and
        memo are reused (they live on the row) and the attempt is stamped with
        a NEW idempotency key, so the previous failed attempt is never
        duplicated. The row returns to PENDING and flows through the normal
        submit path (PENDING → SIGNED → SUBMITTED → … → COMPLETED).
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: Id of the FAILED payment to retry
            example:
              id: pay_98234ab1c09d
      responses:
        "200":
          description: Payment reset to PENDING with a new idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
              example:
                id: pay_98234ab1c09d
                amount: 150
                assetCode: USDC
                status: PENDING
                idempotencyKey: retry_8f7b2c9e4a1d
                sourceAccountId: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                userId: usr_01hv89q7a4mpx3n
                createdAt: "2026-08-26T18:15:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Payment is not in a retryable (FAILED) state (code: STATE_CONFLICT)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: STATE_CONFLICT
                  message: Payment is not in a retryable (FAILED) state
  /api/payments/cancel:
    post:
      tags:
        - Payments
      summary: Cancel a payment
      description: |
        Soft-cancels a payment by transaction hash: the row is flipped to
        CANCELLED so the UI can reflect the status change while the chain
        confirms. Scoped to the authenticated user's own payments.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - txHash
              properties:
                txHash:
                  type: string
                  description: Transaction hash of the payment to cancel
            example:
              id: pay_98234ab1c09d
      responses:
        "200":
          description: Payment cancelled
          content:
            application/json:
              example:
                success: true
                data:
                  id: pay_98234ab1c09d
                  status: CANCELLED
                  cancelledAt: "2026-08-26T18:20:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/payments/export:
    get:
      tags:
        - Payments
      summary: Export payments as CSV
      description: |
        Server-side CSV export of the CURRENT filter results — every row
        matching `status` / `search` (the same filters as GET /api/payments),
        not just the page loaded in the browser. Returns a dated CSV
        attachment that includes all key fields plus memo and transaction hash.
        The response includes an `X-Export-Truncated` header set to `true`
        when the result set exceeds the export row cap.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Only export payments with this status
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Only export payments matching this search term
      responses:
        "200":
          description: CSV attachment with the matching payment rows
          headers:
            X-Export-Truncated:
              description: true when the result set was truncated to the export cap
              schema:
                type: string
                enum:
                  - "true"
                  - "false"
          content:
            text/csv:
              schema:
                type: string
              example: |-
                id,amount,assetCode,status,destAddress,createdAt
                pay_98234ab1c09d,150.00,USDC,COMPLETED,GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN,2026-08-26T18:15:00.000Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/escrows:
    get:
      tags:
        - Escrows
      summary: List escrows or fetch one by id
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: integer
          description: Fetch a single escrow by on-chain id
      responses:
        "200":
          description: Escrow list or single escrow
          content:
            application/json:
              example:
                success: true
                data:
                  - id: escrow_019a48f2
                    contractAddress: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
                    status: FUNDED
                    amount: 5000000000
                    assetCode: USDC
                    payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                    releaseAfter: 1735689600
                    createdAt: "2026-08-26T18:45:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Escrows
      summary: Create an on-chain escrow
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payee
                - amount
              properties:
                payee:
                  type: string
                  description: Recipient Stellar address
                amount:
                  type: number
                  description: Amount in stroops
                assetCode:
                  type: string
                  default: XLM
                releaseAfter:
                  type: integer
                  description: Unix timestamp
                releaseTo:
                  type: string
                  description: Stellar address, defaults to caller
                memo:
                  type: string
                  maxLength: 28
            example:
              payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
              amount: 5000000000
              assetCode: USDC
              releaseAfter: 1735689600
              memo: ESCROW-MILESTONE-1
      responses:
        "201":
          description: Escrow created
          content:
            application/json:
              example:
                success: true
                data:
                  id: escrow_019a48f2
                  contractAddress: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
                  status: FUNDED
                  amount: 5000000000
                  assetCode: USDC
                  payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                  releaseAfter: 1735689600
                  createdAt: "2026-08-26T18:45:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/escrows/{id}:
    get:
      tags:
        - Escrows
      summary: Get an escrow by id
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Escrow details
          content:
            application/json:
              example:
                success: true
                data:
                  id: escrow_019a48f2
                  contractAddress: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
                  status: FUNDED
                  amount: 5000000000
                  assetCode: USDC
                  payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                  releaseAfter: 1735689600
                  createdAt: "2026-08-26T18:45:00.000Z"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/streams:
    get:
      tags:
        - Streams
      summary: List streams or fetch one by id
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: integer
          description: Fetch a single stream by on-chain id
      responses:
        "200":
          description: Stream list or single stream
          content:
            application/json:
              example:
                success: true
                data:
                  - id: stream_4418a99b
                    streamAddress: CCQ75YJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC019
                    status: ACTIVE
                    totalDeposit: 10000000000
                    ratePerSecond: 3858
                    payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                    startTime: 1724695200
                    endTime: 1727287200
                    createdAt: "2026-08-26T18:50:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Streams
      summary: Create an on-chain payment stream
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payee
                - amount
              properties:
                payee:
                  type: string
                  description: Recipient Stellar address
                amount:
                  type: number
                  description: Total amount in stroops
                assetCode:
                  type: string
                  default: XLM
                startTime:
                  type: integer
                  description: Unix timestamp
                endTime:
                  type: integer
                  description: Unix timestamp
                memo:
                  type: string
                  maxLength: 28
            example:
              payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
              amount: 10000000000
              assetCode: USDC
              startTime: 1724695200
              endTime: 1727287200
              memo: STREAM-SALARY
      responses:
        "201":
          description: Stream created
          content:
            application/json:
              example:
                success: true
                data:
                  id: stream_4418a99b
                  streamAddress: CCQ75YJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC019
                  status: ACTIVE
                  totalDeposit: 10000000000
                  ratePerSecond: 3858
                  payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                  startTime: 1724695200
                  endTime: 1727287200
                  createdAt: "2026-08-26T18:50:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/streams/{id}:
    get:
      tags:
        - Streams
      summary: Get a stream by id
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stream details
          content:
            application/json:
              example:
                success: true
                data:
                  id: stream_4418a99b
                  streamAddress: CCQ75YJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC019
                  status: ACTIVE
                  totalDeposit: 10000000000
                  ratePerSecond: 3858
                  withdrawnAmount: 2500000000
                  remainingBalance: 7500000000
                  payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                  startTime: 1724695200
                  endTime: 1727287200
        "404":
          $ref: "#/components/responses/NotFound"
  /api/timelock:
    get:
      tags:
        - Timelock
      summary: List pending timelocked actions
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: integer
            minimum: 1
          description: Fetch a single timelocked action; rejected if non-numeric
      responses:
        "200":
          description: Timelock list or single action
          content:
            application/json:
              example:
                success: true
                data:
                  actions:
                    - actionId: 1
                      target: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
                      eta: 1724781600
                      executed: false
                      proposedAt: 1724695200
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/rbac:
    get:
      tags:
        - RBAC
      summary: Look up role assignments
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: addr
          in: query
          schema:
            type: string
          description: Stellar address to look up; returns the full role map when omitted
      responses:
        "200":
          description: Role assignment(s)
          content:
            application/json:
              example:
                success: true
                data:
                  address: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                  roles:
                    - admin
                    - operator
                  permissions:
                    - payments:write
                    - multisig:propose
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/fee-config:
    get:
      tags:
        - Fee Config
      summary: Get the current fee configuration
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Fee configuration
          content:
