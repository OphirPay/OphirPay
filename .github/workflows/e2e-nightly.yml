name: "🌙 E2E Nightly & Dispatch"

# Issue #729 — commit 2b2173d removed the Playwright shard jobs from ci.yml, so
# the e2e/ suite lost its CI signal entirely. This workflow restores the signal
# without paying the PR-time cost: it runs nightly and on demand
# (workflow_dispatch, e.g. to check a release candidate before shipping).
#
# playwright.config.ts deliberately has no `webServer` block, so this workflow
# has to start a server itself. Next.js is built with `output: "standalone"`,
# for which `next start` is explicitly unsupported ("⚠ next start does not work
# with output: standalone") — the supported entry point is
# `node .next/standalone/server.js`, with `public/` and `.next/static/` staged
# into it the same way the Dockerfile does. Everything runs against localhost,
# so the suite no longer depends on a live Vercel deployment.

on:
  schedule:
    # 02:00 UTC every day.
    - cron: "0 2 * * *"
  # Manual dispatch so a release candidate can be checked on demand.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A nightly run and a manual dispatch must not overlap; the newer run wins.
concurrency:
  group: e2e-nightly
  cancel-in-progress: false

# Runtime configuration for the build and the server. NEXT_PUBLIC_* variables
# are inlined into the bundle by Next.js at **build** time, so they must be set
# for `npm run build` as well as when the server starts.
#
# NODE_ENV is intentionally NOT set here: `npm ci` treats NODE_ENV=production
# as "omit devDependencies", which would strip the very tools (TypeScript,
# Prisma CLI, Playwright) the build needs. It is set on the steps that require
# production behaviour instead.
env:
  CI: true
  E2E_BASE_URL: http://localhost:3000
  DATABASE_URL: postgresql://ophirpay:ophirpay@localhost:5432/ophirpay
  DATABASE_PROVIDER: postgresql
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
  NEXT_PUBLIC_STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
  NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  NEXT_PUBLIC_CONTRACT_ID: CCQGGUJRRVXMHNEX2RYPODGJE2YRMYY4Y7A3KTJH3QP2LWZLTCOPRPET
  NEXT_PUBLIC_EMITTER_CONTRACT_ID: CDAVU2XJ7C2Y52GRJZKRG3HDI7AJ2K2FHAFH5FPDTSUQAV7XNBQNNVAN
  # E2E-only value; never used for a real deployment (>= 32 chars for env.ts).
  AUTH_SECRET: ci-e2e-auth-secret-not-for-production

jobs:
  playwright-tests:
    name: "🧪 E2E — shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ophirpay
          POSTGRES_PASSWORD: ophirpay
          POSTGRES_DB: ophirpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ophirpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Create the schema in the CI database
        run: npx prisma db push --skip-generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build the app
        run: npm run build

      - name: Stage the standalone server
        # A standalone build does not serve `public/` or `.next/static/` on its
        # own; copy them into the standalone tree exactly like the Dockerfile.
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

      - name: Start the server
        run: |
          NODE_ENV=production HOSTNAME=0.0.0.0 PORT=3000 \
            node .next/standalone/server.js > /tmp/next-server.log 2>&1 &

          # Phase 1: Wait for Next.js process to start serving (liveness check).
          echo "Waiting for Next.js process to answer /api/health/live..."
          live_ok=false
          for _ in $(seq 1 60); do
            live_code=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_BASE_URL/api/health/live" || true)
            if [ "$live_code" = "200" ]; then
              echo "✅ Process up (/api/health/live returned 200)"
              live_ok=true
              break
            fi
            sleep 1
          done

          if [ "$live_ok" != "true" ]; then
            echo "::error::Server process failed to answer /api/health/live within 60s"
            cat /tmp/next-server.log
            exit 1
          fi

          # Phase 2: Wait for database readiness (/api/health).
          # In src/app/api/health/route.ts:
          # - HTTP 200 is returned for healthy OR degraded (Stellar/Redis unreachable, but DB is operational).
          # - HTTP 503 is returned ONLY when the critical database connection check fails.
          # The E2E suite requires a working database to execute tests, so HTTP 200 is strictly required.
          echo "Waiting for database readiness (/api/health returning HTTP 200)..."
          ready_ok=false
          health_json=""
          code=""
          for _ in $(seq 1 30); do
            health_response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$E2E_BASE_URL/api/health" || true)
            code=$(echo "$health_response" | tail -n 1 | sed 's/HTTP_STATUS://')
            health_json=$(echo "$health_response" | sed '$d')

            if [ "$code" = "200" ]; then
              echo "✅ Database ready and server operational (HTTP 200)"
              ready_ok=true
              break
            fi
            sleep 1
          done

          if [ "$ready_ok" != "true" ]; then
            echo "::error::Server failed database readiness check (/api/health returned HTTP ${code:-<none>})"
            echo "--- /api/health JSON response ---"
            echo "$health_json"
            echo "--- Server Log (/tmp/next-server.log) ---"
            cat /tmp/next-server.log
            exit 1
          fi

      - name: Run Playwright (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-server-log-${{ matrix.shardIndex }}
          path: /tmp/next-server.log
          retention-days: 3

  merge-reports:
    name: "📊 Merge reports"
    if: always()
    needs: playwright-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-html-report
          path: playwright-report
          retention-days: 14

  track-nightly-status:
    name: "📣 Track nightly status"
    if: always()
    needs: [playwright-tests, merge-reports]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Update or close tracking issue based on run outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TEST_RESULT: ${{ needs.playwright-tests.result }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TITLE="Nightly E2E failing on ${REF_NAME}"
          LABEL="ci"

          # Search for an existing open tracking issue with this title and label
          EXISTING_ISSUE=$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --label "${LABEL}" \
            --search "${TITLE} in:title" \
            --json number \
            --jq '.[0].number // empty' || true)

          if [ "${TEST_RESULT}" = "failure" ]; then
            echo "E2E tests failed on ${REF_NAME}. Managing tracking issue..."

            BODY=$(cat <<EOF
          ## ❌ Nightly E2E Test Failure on \`${REF_NAME}\`

          Nightly Playwright E2E run [Run #${RUN_NUMBER}](${RUN_URL}) failed on commit \`${COMMIT_SHA}\`.

          - **Workflow Run**: [View run #${RUN_NUMBER}](${RUN_URL})
          - **Merged HTML Report Artifact**: [Download Artifacts](${REPORT_URL}) (artifact name: \`merged-html-report\`)
          - **Trigger**: \`${{ github.event_name }}\`
          - **Branch / Ref**: \`${REF_NAME}\`
          - **Commit**: \`${COMMIT_SHA}\`

          This tracking issue was automatically opened by \`e2e-nightly.yml\`. It will be automatically closed when the suite turns green on a subsequent run.
          EOF
          )

            if [ -n "${EXISTING_ISSUE}" ]; then
              echo "Found existing open tracking issue #${EXISTING_ISSUE}. Adding update comment."
              gh issue comment "${EXISTING_ISSUE}" --repo "${REPO}" --body "E2E tests are still failing on commit \`${COMMIT_SHA}\`. See [Run #${RUN_NUMBER}](${RUN_URL}) and the [merged report artifact](${REPORT_URL})."
            else
              echo "Opening new tracking issue: '${TITLE}'"
              gh issue create \
                --repo "${REPO}" \
                --title "${TITLE}" \
                --label "${LABEL}" \
                --body "${BODY}"
            fi
          elif [ "${TEST_RESULT}" = "success" ]; then
            echo "E2E tests passed on ${REF_NAME}."
            if [ -n "${EXISTING_ISSUE}" ]; then
              echo "Closing existing tracking issue #${EXISTING_ISSUE} following green run #${RUN_NUMBER}."
              gh issue comment "${EXISTING_ISSUE}" --repo "${REPO}" --body "✅ Nightly E2E suite passed on commit \`${COMMIT_SHA}\` in [Run #${RUN_NUMBER}](${RUN_URL}). Automatically closing this issue."
              gh issue close "${EXISTING_ISSUE}" --repo "${REPO}" --reason "completed"
            else
              echo "No open tracking issue found to close. Suite is green."
            fi
          else
            echo "Test result was '${TEST_RESULT}' (cancelled or skipped). No tracking issue update needed."
          fi

