name: Flaky Test Detection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  e2e-with-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run E2E with automatic retry
        id: e2e
        continue-on-error: true
        run: npx playwright test --retries=2
      - name: Detect flaky passes
        id: flaky
        run: |
          python3 scripts/detect-flaky.py
      - name: Annotate PR with flaky results
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const flaky = process.env.FLAKY_RESULTS || '';
            const body = flaky
              ? `## ⚠️ Flaky Test Alert\n\nTests that required retries but passed:\n\n${flaky.split(',').map(t => `- \`${t}\``).join('\n')}\n\nPlease mark and fix these per the process in \`docs/flaky-tests.md\`.`
              : `## ✅ No Flaky Tests\n\nAll E2E tests passed on the first attempt.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          FLAKY_RESULTS: ${{ steps.flaky.outputs.FLAKY }}
      - name: Fail if E2E failed outright
        if: steps.e2e.outcome == 'failure'
        run: exit 1
