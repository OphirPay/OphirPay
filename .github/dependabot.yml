version: 2

# Issues #732, #1415 — keep dependency updates flowing without drowning reviewers.
#
# Every ecosystem the repo actually pins is covered: the root npm lockfile,
# both Cargo.lock files (contracts/ophirpay, contracts/emitter) and the pinned
# GitHub Actions. Minor and patch updates are organized into logical ecosystem
# groups (`react-ecosystem`, `dev-tools`, `utilities`, `soroban-sdk`,
# `rust-tooling`, and `github-actions`), while major bumps remain isolated in
# individual PRs so breaking changes get dedicated review.
#
# See CONTRIBUTING.md → "Dependency Updates" for the review flow.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"
          - "vitest*"
          - "@vitest/*"
          - "@playwright/*"
          - "playwright*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"
      utilities:
        patterns:
          - "zod"
          - "date-fns*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/ophirpay"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/emitter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
