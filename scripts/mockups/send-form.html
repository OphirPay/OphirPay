<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Send Payment - OphirPay</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,-apple-system,sans-serif}</style></head>
<body class="bg-gray-50 text-gray-900">
<div class="flex min-h-screen">
<aside class="fixed left-0 top-0 h-full w-64 bg-white border-r border-gray-200 flex flex-col">
<div class="flex items-center gap-3 px-6 h-16 border-b border-gray-200"><div class="h-9 w-9 rounded-lg bg-gradient-to-br from-blue-600 to-cyan-400 flex items-center justify-center shadow-lg"><span class="text-white font-bold text-lg">O</span></div><div><h1 class="text-lg font-bold leading-none">OphirPay</h1><p class="text-xs text-gray-500">Stellar Payments</p></div></div>
<nav class="flex-1 px-3 py-4 space-y-1">
<a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600"><span class="text-gray-400"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101"/></svg></span>Treasury</a>
<a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-blue-50 text-blue-700"><span class="text-blue-600"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126"/></svg></span>Send<span class="ml-auto h-1.5 w-1.5 rounded-full bg-blue-500"></span></a>
<a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600"><span class="text-gray-400"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5"/></svg></span>Payments</a>
</nav>
</aside>
<div class="flex-1 ml-64">
<header class="sticky top-0 h-16 bg-white/80 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-6"><h2 class="text-sm font-medium text-gray-500">Financial Operations Platform</h2><div class="flex items-center gap-3"><div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-50 border border-green-200"><span class="text-sm font-mono font-medium text-green-700">12,500.00 XLM</span></div><div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 border border-blue-200"><span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span><span class="text-sm font-medium text-blue-700">TESTNET</span></div><div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 border border-gray-200"><div class="h-6 w-6 rounded-full bg-gradient-to-br from-blue-600 to-cyan-400 flex items-center justify-center text-white text-xs font-bold">G</div><span class="text-sm font-mono text-gray-700">GABC...XYZ12</span></div></div></header>
<main class="p-6">
<div class="max-w-lg mx-auto mt-8">
<div class="mb-6"><a class="text-sm text-gray-500">← Dashboard</a><h1 class="text-2xl font-bold mt-2">Send Payment</h1><p class="text-gray-500 mt-1">Send XLM on the Stellar Testnet</p></div>
<div class="bg-white rounded-xl border border-gray-200 p-5 mb-4"><div class="flex items-center justify-between"><div><p class="text-sm text-gray-500">From</p><p class="text-sm font-mono font-medium">GABC...XYZ12</p></div><div class="text-right"><p class="text-sm text-gray-500">Balance</p><p class="text-sm font-mono font-semibold">12,500.00 XLM</p></div></div></div>
<div class="bg-white rounded-xl border border-gray-200 p-5 space-y-4">
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">Destination Address</label><input type="text" placeholder="G..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-white font-mono text-sm" value="GBD4RXYZ1234567890ABCDEFGHIJKLMNOPQRST"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">Amount (XLM)</label><div class="relative"><input type="number" value="100" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-white font-mono text-sm pr-16"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400 font-medium">XLM</span></div></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5">Memo <span class="text-gray-400 font-normal">(optional)</span></label><input type="text" placeholder="e.g. Payment for services" value="Test payment" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-white text-sm"></div>
<button class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-medium text-sm shadow-lg">Send XLM</button>
</div></div></main></div></div></body></html>
