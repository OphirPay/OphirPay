[package]
name = "ophirpay-formal-verification"
version = "0.1.0"
edition = "2021"
description = "Kani formal verification proofs and reference models for OphirPay contract invariants"

[dependencies]
# When running with cargo-kani, kani is injected automatically.
# Standard cargo check/test uses internal mock fallbacks.

[dev-dependencies]

[profile.release]
opt-level = 0  # Kani works better without optimization

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
