# Minimal standalone Kubernetes Deployment manifest for OphirPay.
# For production deployments with HPA, PDB, NetworkPolicy, or ServiceAccount support,
# use the Helm chart in helm/ophirpay/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ophirpay
  labels:
    app: ophirpay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ophirpay
  template:
    metadata:
      labels:
        app: ophirpay
    spec:
      containers:
        - name: ophirpay
          image: ophirpay/ophirpay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
