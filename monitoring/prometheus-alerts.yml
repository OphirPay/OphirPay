# OphirPay — Prometheus alert rules
# Prometheus evaluates these rules; configure Alertmanager separately to route
# alerts to PagerDuty, Slack, or another receiver.

groups:
  - name: app_critical
    interval: 30s
    rules:
      # ── Payment Processing Alerts ────────────────────────────

      - alert: PaymentProcessingLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(ophirpay_endpoint_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          component: payments
        annotations:
          summary: "Payment processing latency > 30s (p95)"
          description: |
            P95 payment processing time is {{ $value }}s. Check Stellar RPC
            and database performance.
          runbook_url: "docs/TROUBLESHOOTING.md#payment-processing-latency"

      # ── Webhook Delivery Alerts (issue #1412) ─────────────────

      - alert: OphirPayWebhookHighFailureRate
        expr: |
          (
            sum(rate(ophirpay_delivery_final_outcomes_total{delivery_type="webhook",final_outcome="failure"}[5m])) /
            sum(rate(ophirpay_delivery_final_outcomes_total{delivery_type="webhook"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: webhooks
        annotations:
          summary: "Webhook delivery failure rate > 5%"
          description: |
            Webhook delivery failures exceed 5% over a 5-minute window (current: {{ $value | humanizePercentage }}).
            Check subscriber endpoints and retry delivery queues.
          runbook_url: "docs/TROUBLESHOOTING.md#webhook-delivery-failures"

      - alert: WebhookDeliveryFailureRateHigh
        expr: |
          sum(rate(ophirpay_delivery_final_outcomes_total{delivery_type="webhook",final_outcome="failure"}[15m])) /
          sum(rate(ophirpay_delivery_final_outcomes_total{delivery_type="webhook"}[15m])) > 0.25
        for: 10m
        labels:
          severity: critical
          component: webhooks
        annotations:
          summary: "Webhook delivery failure rate > 25%"
          description: |
            {{ $value | humanizePercentage }} of webhook deliveries have ended
            in failure for at least 10 minutes. Check subscriber endpoints and
            retry attempt distribution.
          runbook_url: "docs/TROUBLESHOOTING.md#webhook-delivery-failures"

      # ── API Health Alerts ────────────────────────────────────

      - alert: ApiHighErrorRate
        expr: |
          rate(ophirpay_endpoint_errors_total[5m]) /
          rate(ophirpay_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API error rate > 5%"
          description: |
            OphirPay API is returning errors at {{ $value | humanizePercentage }}.
            Check logs for root cause.
          runbook_url: "docs/TROUBLESHOOTING.md#api-high-error-rate"

      - alert: ApiDown
        expr: up{job="ophirpay"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "OphirPay API is down"
          description: |
            The OphirPay metrics endpoint is not responding to Prometheus scrapes.
            Instance: {{ $labels.instance }}.
          runbook_url: "docs/TROUBLESHOOTING.md#api-down"

      # ── Soroban RPC Alerts & Telemetry (issue #1412 & #820) ────

      - alert: OphirPayRpcProviderDegraded
        expr: |
          (
            histogram_quantile(0.95, sum by (le) (rate(ophirpay_endpoint_request_duration_seconds_bucket[5m]))) > 2.5
          ) or (
            sum(rate(ophirpay_endpoint_errors_total{status_class="5xx"}[3m])) > 0
          )
        for: 3m
        labels:
          severity: critical
          component: rpc
        annotations:
          summary: "Soroban RPC provider degraded (> 2.5s latency or 5xx errors)"
          description: |
            Soroban RPC provider latency exceeds 2.5s p95 or is returning 5xx responses for 3 minutes.
            Active endpoint may be failing or degraded. Verify provider status and failover health.
          runbook_url: "docs/TROUBLESHOOTING.md#soroban-rpc-degraded"

      - alert: RpcFailoverDegraded
        expr: ophirpay_rpc_failover_active == 1
        for: 2m
        labels:
          severity: warning
          component: rpc
        annotations:
          summary: "Soroban RPC running on a non-primary endpoint"
          description: |
            OphirPay has been serving Soroban RPC traffic from a fallback
            endpoint ({{ $labels.endpoint }}) for more than 2 minutes.
            Failover count: {{ with printf "ophirpay_rpc_failover_total" | query }}
            {{ . | first | value }}{{ end }}. Check the upstream provider
            status and the rpcFailover block of GET /api/health.
          runbook_url: "docs/TROUBLESHOOTING.md#soroban-rpc-degraded"

      - alert: RpcFailoverFrequent
        expr: increase(ophirpay_rpc_failover_total[30m]) >= 3
        for: 5m
        labels:
          severity: warning
          component: rpc
        annotations:
          summary: "Soroban RPC flapping between endpoints"
          description: |
            {{ printf "%.0f" $value }} failovers in the last 30 minutes — the
            primary endpoint is unstable. Verify the primary provider and the
            probe results logged by the failover module.
          runbook_url: "docs/TROUBLESHOOTING.md#soroban-rpc-degraded"

      # ── Database Health Alerts (issue #1412) ───────────────────

      - alert: OphirPayDatabasePoolExhaustion
        expr: |
          (
            rate(ophirpay_db_query_duration_seconds_sum[5m]) /
            rate(ophirpay_db_query_duration_seconds_count[5m])
          ) > 0.5
        for: 2m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Prisma database pool wait / query latency > 500ms"
          description: |
            Average database query latency and pool queue wait time is {{ $value | humanizeDuration }} (> 500ms).
            Database connection pool may be exhausted or experiencing contention.
          runbook_url: "docs/TROUBLESHOOTING.md#database-pool-exhaustion"