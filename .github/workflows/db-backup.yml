# ------------------------------------------------------------------
# Concurrency: singleton for scheduled workflows (no cancellation)
# This workflow runs on a schedule to back up the database.
# ------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-singleton
  cancel-in-progress: false

name: DB Backup

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 03:00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Run backup script
        run: echo "Backup logic here"
