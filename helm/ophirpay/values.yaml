# Default values for ophirpay.
# This is a Helm chart for OphirPay.

replicaCount: 1

image:
  repository: ophirpay/ophirpay
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration environment variables.
#
# IMPORTANT NOTICE REGARDING FRONTEND ENVIRONMENT VARIABLES:
# NEXT_PUBLIC_* variables (such as NEXT_PUBLIC_STELLAR_HORIZON_URL and NEXT_PUBLIC_STELLAR_RPC_URL)
# are inlined into the client-side JavaScript bundle at Next.js BUILD TIME.
# Setting or updating NEXT_PUBLIC_* values in this ConfigMap at runtime will NOT affect
# a pre-built Docker image. To point the application frontend at a different network (e.g. mainnet),
# the container image must be built with those NEXT_PUBLIC_* build arguments set during `docker build`.
# ConfigMap values are supplied for server-side reference and documentation.
config:
  NEXT_PUBLIC_STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  NEXT_PUBLIC_STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
  NEXT_PUBLIC_CONTRACT_ID: "CCQGGUJRRVXMHNEX2RYPODGJE2YRMYY4Y7A3KTJH3QP2LWZLTCOPRPET"
  NEXT_PUBLIC_EMITTER_CONTRACT_ID: "CDAVU2XJ7C2Y52GRJZKRG3HDI7AJ2K2FHAFH5FPDTSUQAV7XNBQNNVAN"
  NEXT_PUBLIC_CHAIN_READ_SOURCE: "GACNKEDGJYLLVQDXWYEEPB47Y3JEV5JNZ3RQANTJIVKKEOXX4NC4YWHU"
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
