name: Docs Link Checker

on:
  push:
    branches: [main, integration/staging]
    paths:
      - '**/*.md'
      - 'scripts/check-docs-links.mjs'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    branches: [main, integration/staging]
    paths:
      - '**/*.md'
      - 'scripts/check-docs-links.mjs'
      - '.github/workflows/docs-link-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check Documentation Links & Anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Validate Markdown Links and Anchors
        run: node scripts/check-docs-links.mjs
      - name: Check External Links (Warnings Only)
        run: node scripts/check-docs-links.mjs --check-external
