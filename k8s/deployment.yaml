# ─────────────────────────────────────────────────────────────────────────────
# Minimal standalone example — the Helm chart is the supported path.
#
# These manifests mirror the defaults in helm/ophirpay/values.yaml so the app
# can be applied with `kubectl apply -f k8s/` where Helm is unavailable. The
# chart renders the same objects plus the flag-gated extras (autoscaling, PDB,
# NetworkPolicy, ServiceAccount) from values; prefer it for real deployments.
# Keep changes here in sync with helm/ophirpay/values.yaml.
#
# NEXT_PUBLIC_* values (k8s/namespace-config.yaml) are inlined by Next.js at
# build time, so a prebuilt image ignores them — see docs/DEPLOYMENT.md.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ophirpay
  namespace: ophirpay
  labels:
    app: ophirpay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ophirpay
  namespace: ophirpay
  labels:
    app: ophirpay
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ophirpay
  template:
    metadata:
      labels:
        app: ophirpay
    spec:
      serviceAccountName: ophirpay
      containers:
        - name: ophirpay
          image: ghcr.io/ophirpay/ophirpay:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: ophirpay-config
            - secretRef:
                name: ophirpay-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # ── Probes (issue #738) ──────────────────────────────
          # Liveness must NOT depend on a backing service: /api/health/live
          # only proves the process is serving, so a Postgres/Soroban/Redis
          # outage cannot restart-loop a healthy pod.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness is dependency-aware: /api/health returns 503 when the
          # database is unreachable, which drains traffic from the pod without
          # killing it. Timings differ from liveness for the same reason.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: ophirpay
  namespace: ophirpay
  labels:
    app: ophirpay
spec:
  type: ClusterIP
  selector:
    app: ophirpay
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ophirpay
  namespace: ophirpay
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ophirpay.com
        - api.ophirpay.com
      secretName: ophirpay-tls
  rules:
    - host: ophirpay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ophirpay
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ophirpay
  namespace: ophirpay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ophirpay
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ophirpay
  namespace: ophirpay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ophirpay
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ophirpay
  namespace: ophirpay
spec:
  podSelector:
    matchLabels:
      app: ophirpay
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Cluster DNS — required for in-cluster names to resolve.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:  # Allow outbound to Stellar network
      ports:
        - protocol: TCP
          port: 443
