name: Gas Regression Check

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'package.json'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-gas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Record baseline (if missing)
        run: node scripts/check-gas-regression.cjs --record --if-missing
      - name: Run gas/WASM regression check
        run: node scripts/check-gas-regression.cjs --check
      - name: Report to job summary
        if: always()
        run: |
          if [ -f gas-summary.md ]; then
            cat gas-summary.md >> $GITHUB_STEP_SUMMARY
          fi
