version: 2

# Issue #732, #1320 — keep dependency updates flowing without drowning reviewers.
#
# Every ecosystem the repo actually pins is covered: the root npm lockfile,
# both Cargo.lock files (contracts/ophirpay, contracts/emitter) and the pinned
# GitHub Actions. Each is checked once a week and minor/patch bumps are grouped
# into a single PR per ecosystem; a major bump still arrives on its own so it
# gets the attention it needs. `open-pull-requests-limit` caps the backlog a
# busy week can create.
#
# While batch mode is active and `integration/staging` exists, all entries target
# `target-branch: "integration/staging"` so that PRs pass `enforce-integration-branch.yml`.
# See CONTRIBUTING.md → "Dependency Updates" for the review flow and switch-back step.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "integration/staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/ophirpay"
    target-branch: "integration/staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-ophirpay-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/emitter"
    target-branch: "integration/staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-emitter-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "integration/staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
