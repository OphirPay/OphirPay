name: Check Markdown Links

on:
  pull_request:
    branches: [main, integration/staging]
    paths:
      - "docs/**/*.md"
      - "README.md"
      - ".github/workflows/links.yml"
      - ".lycheeignore"
  push:
    branches: [main, integration/staging]
    paths:
      - "docs/**/*.md"
      - "README.md"
      - ".github/workflows/links.yml"
      - ".lycheeignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  link-checker:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --exclude 'http://localhost(:[0-9]+)?'
            --exclude 'http://127\.0\.0\.1(:[0-9]+)?'
            --exclude 'https://localhost(:[0-9]+)?'
            --exclude 'https://127\.0\.0\.1(:[0-9]+)?'
            --exclude 'http://\[::1\](:[0-9]+)?'
            --exclude 'mailto:.*'
            --exclude 'https://ophirpay\.ci\.invalid.*'
            --max-retries 3
            --timeout 10
            docs/**/*.md README.md
          fail: true
