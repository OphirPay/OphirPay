name: Lighthouse CI

# Run on a daily schedule and on PRs that target the integration/staging branch
on:
  schedule:
    - cron: '0 2 * * *' # every day at 02:00 UTC
  pull_request:
    branches:
      - integration/staging
    paths:
      - 'src/**'
      - 'lighthouserc.json'
      - 'package.json'
      - 'next.config.js'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the Next.js app
        run: npm run build

      - name: Start the app in the background
        env:
          PORT: 3000
        run: |
          npm start &
          echo $! > server.pid

      - name: Wait for the server to be ready
        run: npx wait-on http://localhost:3000

      - name: Install Lighthouse CI CLI
        run: npm i -g @lhci/cli@0.12.x

      # Run Lighthouse CI for mobile emulation
      - name: Run Lighthouse CI (mobile)
        run: lhci autorun --config=./lighthouserc.json --preset=mobile

      # Run Lighthouse CI for desktop emulation
      - name: Run Lighthouse CI (desktop)
        run: lhci autorun --config=./lighthouserc.json --preset=desktop

      - name: Stop the server
        if: always()
        run: |
          kill $(cat server.pid) || true
