groups:
  - name: test_duplicate
    rules:
      - alert: DuplicateAlertName
        expr: rate(ophirpay_http_requests_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "First instance"

      - alert: DuplicateAlertName
        expr: rate(ophirpay_http_requests_total[5m]) > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Second instance (duplicate)"
