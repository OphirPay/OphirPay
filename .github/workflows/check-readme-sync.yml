name: Check README sync
on:
  push:
    branches:
      - integration/staging
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run README sync check
        run: node scripts/check-readme-sync.js
