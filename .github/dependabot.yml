version: 2
updates:
  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "OphirPay/maintainers"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    # Only notify for critical and high severity advisories
    # (Dependabot security updates are enabled separately in repo settings)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Backend dependencies (if separate package.json or other ecosystems)
  # Add Docker if applicable
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "devops"
    commit-message:
      prefix: "chore(deps)"
