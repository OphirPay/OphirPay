apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ophirpay.fullname" . }}-config
  labels:
    {{- include "ophirpay.labels" . | nindent 4 }}
data:
  {{- $envExample := .Files.Get ".env.example" -}}
  {{- if $envExample -}}
    {{- range $key, $val := .Values.config -}}
      {{- if not (regexMatch (printf "(?m)^#?\\s*%s\\s*=" $key) $envExample) -}}
        {{- fail (printf "Config key '%s' set in Helm values is not present in .env.example" $key) -}}
      {{- end -}}
    {{- end -}}
  {{- end }}
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
