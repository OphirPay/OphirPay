<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Transaction Success - OphirPay</title>

<body class="bg-gray-50 text-gray-900">
<div class="flex min-h-screen">

<nav class="flex-1 px-3 py-4 space-y-1">
<a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600"><span class="text-gray-400"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75"/></svg></span>Treasury</a>
<a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-blue-50 text-blue-700"><span class="text-blue-600"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12"/></svg></span>Send<span class="ml-auto h-1.5 w-1.5 rounded-full bg-blue-500"></span></a>
</nav>
</aside>
<div class="flex-1 ml-64">

<main class="p-6">
<div class="max-w-lg mx-auto mt-12">
