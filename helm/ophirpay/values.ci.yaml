# SPDX-License-Identifier: MIT
# CI test overrides for Helm chart validation (Issue #1307)
# Validates schema conformance and feature combinations in automated testing.

replicaCount: 1

image:
  repository: ghcr.io/ophirpay/ophirpay
  tag: ci-test
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: "ophirpay-ci-sa"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: ci.ophirpay.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ophirpay-ci-tls
      hosts:
        - ci.ophirpay.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

config:
  NEXT_PUBLIC_STELLAR_NETWORK: "TESTNET"
  NEXT_PUBLIC_STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  NEXT_PUBLIC_STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
  DATABASE_PROVIDER: "postgresql"
  NODE_ENV: "test"
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  NEXT_PUBLIC_APP_URL: "https://ci.ophirpay.local"
  RATE_LIMIT_RPM: "120"
  AUTH_RATE_LIMIT_IP_RPM: "30"
  AUTH_RATE_LIMIT_WALLET_RPM: "10"
  NEXT_PUBLIC_SENTRY_DSN: ""

secrets:
  DATABASE_URL: "postgresql://ci_user:ci_pass@ci-postgres:5432/ophirpay_ci"
  NEXT_PUBLIC_CONTRACT_ID: "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  NEXT_PUBLIC_EMITTER_CONTRACT_ID: "CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"
  AUTH_SECRET: "ci_auth_secret_minimum_32_characters_for_validation"
