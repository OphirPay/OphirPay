name: Release Docker Image to GHCR

# Builds, scans, and publishes multi-architecture container images to GitHub
# Container Registry (GHCR) upon release publication or tag creation, with
# built-in GITHUB_TOKEN authentication, SBOM generation, and cryptographic
# provenance attestations.
#
# Supports manual dry-run execution via workflow_dispatch without pushing.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      push:
        description: 'Push image to GHCR (uncheck for dry-run)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write     # Required for pushing container image to ghcr.io
  id-token: write     # Required for Sigstore OIDC build provenance attestation
  attestations: write # Required for actions/attest-build-provenance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: "Build & Publish Multi-Arch Image to GHCR"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-architecture builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ophirpay/ophirpay
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || '' }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and Push Multi-Arch Image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Build Provenance for Published Digest
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.push) && steps.build-push.outputs.digest != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ophirpay/ophirpay
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
