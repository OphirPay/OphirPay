# Production environment values for OphirPay Helm chart
# Extends base values.yaml with production domain, letsencrypt-prod certificate issuer,
# multi-replica high availability, and production resource limits.

replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: ophirpay.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ophirpay-tls
      hosts:
        - ophirpay.com

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

config:
  NEXT_PUBLIC_APP_URL: "https://ophirpay.com"
