version: 2

# Issue #732, #1415 — intelligent Dependabot grouping to prevent reviewer fatigue and CI saturation.
#
# Groups minor and patch updates by ecosystem and domain:
#   - npm:
#       - react-ecosystem (next, react, react-dom, @types/react*)
#       - dev-tools (eslint*, prettier*, vitest*, @vitest*, @playwright*, typescript*)
#       - utilities (zod*, date-fns*, clsx*, tailwind-merge*)
#   - cargo (contracts/ophirpay & contracts/emitter):
#       - soroban-sdk (soroban-sdk*, soroban-env-*)
#       - rust-tooling (rstest*, proptest*, pretty_assertions*)
#   - github-actions:
#       - single monthly bundled update to reduce repository PR noise
#
# Note: Security advisories are excluded from groups by GitHub Dependabot policy
# and will continue to open individual, high-priority PRs immediately.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "eslint*"
          - "@eslint*"
          - "prettier*"
          - "vitest*"
          - "@vitest*"
          - "@playwright*"
          - "playwright*"
          - "typescript"
          - "tsx"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      utilities:
        patterns:
          - "zod*"
          - "date-fns*"
          - "clsx"
          - "tailwind-merge"
          - "dotenv*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/ophirpay"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-sdk*"
          - "soroban-env-*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "rstest*"
          - "proptest*"
          - "pretty_assertions*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/emitter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-sdk*"
          - "soroban-env-*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "rstest*"
          - "proptest*"
          - "pretty_assertions*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
