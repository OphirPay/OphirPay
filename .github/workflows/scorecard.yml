name: "🛡️ OpenSSF Scorecard"

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        # ossf/scorecard-action does not publish a floating `v2` tag — only
        # concrete v2.4.x tags — so `@v2` fails to resolve (weekly job was
        # failing since 2026-08-17). Pin to the latest v2.4.x release.
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
