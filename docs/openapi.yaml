            type: string
      responses:
        "200":
          description: Counts of cancelled / skipped / total payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCancelBatchResponse"
              example:
                success: true
                data:
                  batchId: batch_7710a9c82e
                  cancelled: 2
                  skipped: 0
                  total: 2
                meta:
                  timestamp: "2026-08-26T18:31:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
