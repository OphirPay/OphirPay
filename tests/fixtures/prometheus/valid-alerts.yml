groups:
  - name: test_valid
    rules:
      - alert: TestExposedMetricAlert
        expr: rate(ophirpay_http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP requests"

      - alert: TestDeclaredExternalAlert
        # external: custom_external_counter
        expr: custom_external_counter > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Custom external counter exceeded"
