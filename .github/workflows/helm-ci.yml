name: Helm CI

on:
  push:
    branches: [integration/staging]
  pull_request:
    branches: [integration/staging]

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.3

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Helm lint (default values)
        run: helm lint helm/ophirpay

      - name: Helm lint (fully enabled)
        run: |
          helm lint helm/ophirpay \
            --set autoscaling.enabled=true \
            --set pdb.enabled=true \
            --set networkPolicy.enabled=true \
            --set serviceAccount.enabled=true

      - name: Render chart (default values)
        run: |
          helm template ophirpay helm/ophirpay > /tmp/ophirpay-default.yaml

      - name: Render chart (fully enabled)
        run: |
          helm template ophirpay helm/ophirpay \
            --set autoscaling.enabled=true \
            --set pdb.enabled=true \
            --set networkPolicy.enabled=true \
            --set serviceAccount.enabled=true > /tmp/ophirpay-enabled.yaml

      - name: Validate manifests with kubeconform
        run: |
          docker run --rm -v /tmp:/tmp quay.io/yannh/kubeconform:latest \
            -summary -output json -strict \
            /tmp/ophirpay-default.yaml /tmp/ophirpay-enabled.yaml

      - name: Check ConfigMap keys drift
        run: |
          # Extract keys from .env.example
          env_keys=$(awk -F= '/^[^#]/ {print $1}' .env.example | tr '\n' ' ')
          # Extract keys from the rendered ConfigMap
          cfg_keys=$(yq e '.data | keys | .[]' /tmp/ophirpay-default.yaml | tr '\n' ' ')
          # Compare
          missing=$(comm -23 <(echo "$env_keys" | tr ' ' '\n' | sort) <(echo "$cfg_keys" | tr ' ' '\n' | sort))
          if [ -n "$missing" ]; then
            echo "Missing config keys in ConfigMap: $missing"
            exit 1
          fi
