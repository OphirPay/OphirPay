groups:
  - name: rpc-failover
    rules:
      - alert: NonPrimaryRpcInUse
        expr: rpc_active_endpoint_index{job="ophirpay"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Non-primary RPC endpoint in use"
          description: "The application is using a non-primary RPC endpoint for more than 5 minutes."
