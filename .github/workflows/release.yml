name: Release — Container Image

# Issue #749 — nothing built or pushed ghcr.io/ophirpay/ophirpay, yet
# k8s/deployment.yaml and helm/ophirpay/values.yaml referenced it with the
# moving `latest` tag and `imagePullPolicy: Always`. Every pod restart could
# therefore pull a different, hand-built, unreviewed image. This workflow
# builds the existing Dockerfile on a version tag and pushes *immutable* tags
# (the semantic version and the commit SHA) to GHCR.
#
# Issue #750 — the published image carries an SBOM and a verifiable build
# provenance attestation, so a consumer can answer "what exactly is in this
# build, and was it built from this commit?".
#
# Dry run: `workflow_dispatch` defaults to building only — it does not log in,
# push, attest or sign.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — do not push, attest or sign"
        type: boolean
        default: true
      version:
        description: "Version tag to attach to the dry-run build (e.g. v0.1.0)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: "🐳 Build, push & attest"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # attach SBOMs to the GitHub release
      packages: write # push the image + registry attestations
      id-token: write # keyless signing / provenance OIDC token
      attestations: write # GitHub build-provenance attestations

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and image reference
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase path components. The upstream repo is already
          # lowercase, but a fork owner may not be.
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION:-v0.0.0-dryrun}"
            DRY_RUN="${INPUT_DRY_RUN:-true}"
          else
            VERSION="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${VERSION} (dry_run=${DRY_RUN})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          # Immutable-first tagging:
          #   • the semantic version (`v0.1.0`) — what k8s/Helm pin;
          #   • the commit SHA (`sha-<full sha>`) — traceable to a commit;
          #   • `latest` moves ONLY for a non-prerelease tag push, because a
          #     moving tag is the exact failure mode this issue describes. Use
          #     `--set image.tag=` (Helm) to deliberately opt back into it.
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(steps.meta.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=OphirPay
            org.opencontainers.image.description=Stellar payment orchestration layer
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Both architectures are published. The Dockerfile is multi-arch
          # clean (Debian/glibc base, no native musl binaries).
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit attaches SLSA provenance + an SPDX SBOM to the image
          # manifest in the registry.
          provenance: mode=max
          sbom: true

      - name: Set up Node.js
        if: steps.meta.outputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install syft
        if: steps.meta.outputs.dry_run != 'true'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate image SBOM (SPDX)
        if: steps.meta.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          syft "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json=ophirpay-image.spdx.json
          test -s ophirpay-image.spdx.json
          echo "Image SBOM: $(du -h ophirpay-image.spdx.json | cut -f1)"

      - name: Generate dependency SBOM (CycloneDX)
        if: steps.meta.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx > ophirpay-dependencies.cdx.json
          test -s ophirpay-dependencies.cdx.json
          echo "Dependency SBOM: $(du -h ophirpay-dependencies.cdx.json | cut -f1)"

      - name: Attest build provenance
        if: steps.meta.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        if: steps.meta.outputs.dry_run != 'true'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ophirpay-image.spdx.json
          push-to-registry: true

      - name: Upload SBOMs as workflow artifacts
        if: steps.meta.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.version }}
          path: |
            ophirpay-image.spdx.json
            ophirpay-dependencies.cdx.json
          retention-days: 90

      - name: Attach SBOMs to the GitHub release (when one exists)
        if: github.event_name == 'push' && steps.meta.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              ophirpay-image.spdx.json ophirpay-dependencies.cdx.json --clobber
            echo "SBOMs attached to release ${GITHUB_REF_NAME}"
          else
            echo "::notice::No GitHub release for ${GITHUB_REF_NAME} yet — the SBOMs are attached to the image in GHCR and uploaded as workflow artifacts."
          fi

      - name: Install cosign
        if: steps.meta.outputs.dry_run != 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        if: steps.meta.outputs.dry_run != 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Publish job summary
        run: |
          {
            echo "### OphirPay container release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${{ steps.meta.outputs.image }}\` |"
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Dry run | \`${{ steps.meta.outputs.dry_run }}\` |"
            echo ""
            echo "Verify: \`gh attestation verify oci://${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }} --repo ${GITHUB_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
