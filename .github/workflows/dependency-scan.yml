name: Dependency Vulnerability Scan — Nightly

# Runs the dependency vulnerability scan on a nightly schedule and on
# demand (workflow_dispatch). Every pull request additionally gets the same
# blocking scan from the `dependency-scan` job in ci.yml (issue #394).
#
# The scan (scripts/audit-dependencies.mjs) runs `npm audit --json`, applies
# the documented suppressions in .github/dependency-suppressions.json, and
# fails when any remaining advisory is rated high or critical. The full JSON
# report is uploaded as an artifact on every run.

on:
  schedule:
    # Nightly 03:17 UTC — off-peak for GitHub Actions minutes.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read


# -- Global Concurrency � singleton group for scheduled runs --------
concurrency:
  group: ${{ github.workflow }}

jobs:
  prepare_refs:
    name: "🔎 Find scheduled refs"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: refs
        name: Include refs that exist
        run: |
          matrix=$(git ls-remote --heads origin \
            refs/heads/main refs/heads/integration/staging \
            | awk '{sub("^refs/heads/", "", $2); print $2}' \
            | jq -Rsc 'split("\n") | map(select(length > 0)) | map({ref: ., ref_slug: gsub("/"; "-")})')
          if [ "$(jq 'length' <<< "$matrix")" -eq 0 ]; then
            echo "::error::Neither main nor integration/staging exists"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  dependency-scan:
    name: "Dependency Scan — ${{ matrix.ref }}"
    needs: prepare_refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare_refs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - name: Run dependency vulnerability scan
        run: node scripts/audit-dependencies.mjs
      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report-${{ matrix.ref_slug }}
          path: dependency-audit-report/
          retention-days: 30
