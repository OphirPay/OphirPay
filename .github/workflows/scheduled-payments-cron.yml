# ------------------------------------------------------------------
# Concurrency: singleton for scheduled workflows (no cancellation)
# This workflow runs on a schedule to process payments.
# ------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-singleton
  cancel-in-progress: false

name: Scheduled Payments Cron

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process payments
        run: echo "Payment processing logic here"
