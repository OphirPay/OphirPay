name: "Setup Node.js & Prisma"
description: "Encapsulates repository checkout, Node.js setup with .nvmrc and npm cache, npm ci, and prisma generate."

inputs:
  checkout:
    description: "Whether to run actions/checkout (defaults to false for local workspace action consumption)"
    required: false
    default: "false"
  node-version-file:
    description: "Path to file containing Node version"
    required: false
    default: ".nvmrc"
  cache:
    description: "Package manager cache for setup-node"
    required: false
    default: "npm"
  prisma-generate:
    description: "Whether to run npx prisma generate"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.cache }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Generate Prisma client
      if: ${{ inputs.prisma-generate == 'true' }}
      shell: bash
      run: npx prisma generate
