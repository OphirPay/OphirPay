name: Dependency Vulnerability Scan — Nightly

# Runs the dependency vulnerability scan on a nightly schedule and on
# demand (workflow_dispatch). Every pull request additionally gets the same
# blocking scan from the `dependency-scan` job in ci.yml (issue #394).
#
# The scan (scripts/audit-dependencies.mjs) runs `npm audit --json`, applies
# the documented suppressions in .github/dependency-suppressions.json, and
# fails when any remaining advisory is rated high or critical. The full JSON
# report is uploaded as an artifact on every run.

on:
  schedule:
    # Nightly 03:17 UTC — off-peak for GitHub Actions minutes.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# ── Global Concurrency — singleton group for scheduled runs ────────
concurrency:
  group: ${{ github.workflow }}

jobs:
  resolve-refs:
    name: "Resolve Target Refs"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine existing target branches
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          matrix='[{"ref":"main","slug":"main"}]'
          if gh api "repos/${REPO}/branches/integration/staging" --silent 2>/dev/null; then
            matrix='[{"ref":"main","slug":"main"},{"ref":"integration/staging","slug":"integration-staging"}]'
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  dependency-scan:
    name: "Dependency Vulnerability Scan (${{ matrix.target.ref }})"
    needs: resolve-refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve-refs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - name: Run dependency vulnerability scan
        run: node scripts/audit-dependencies.mjs
      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report-${{ matrix.target.slug }}
          path: dependency-audit-report/
          retention-days: 30
