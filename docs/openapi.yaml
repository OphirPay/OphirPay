            type: string
      responses:
        "200":
          description: Batch details with child payments
          content:
            application/json:
              example:
                success: true
                data:
                  id: batch_7710a9c82e
                  userId: usr_01hv89q7a4mpx3n
                  name: August Payroll Distribution
                  description: Monthly contractor payouts
                  status: COMPLETED
                  items:
                    - id: pay_98234ab1c09d
                      amount: 3200
                      assetCode: USDC
                      status: sent
                      memo: PAYROLL-ENG-01
                  progress:
                    total: 2
                    pending: 0
                    sent: 2
                    failed: 0
                  createdAt: "2026-08-26T18:30:00.000Z"
                  updatedAt: "2026-08-26T18:31:00.000Z"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
