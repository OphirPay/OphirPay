# Default values for OphirPay Helm chart

replicaCount: 2

image:
  repository: ghcr.io/ophirpay/ophirpay
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/api/metrics"

podSecurityContext:
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: ophirpay.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ophirpay-tls
      hosts:
        - ophirpay.com

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

# ── Application Configuration (ConfigMap) ───────────────────────────────────
# NOTE: Next.js inlines NEXT_PUBLIC_* variables into client JavaScript bundles
# at build time (docker build / npm run build). Injecting NEXT_PUBLIC_* via this
# ConfigMap makes them available to server-side code (SSR, API routes) at runtime,
# but prebuilt client bundles will NOT read runtime ConfigMap overrides.
# If targeting a different network (e.g. Testnet vs Public Mainnet) in client
# components, the container image MUST be built with those variables provided at
# build time.
config:
  NEXT_PUBLIC_STELLAR_NETWORK: "TESTNET"
  NEXT_PUBLIC_STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  NEXT_PUBLIC_STELLAR_RPC_URL: "https://soroban-testnet.stellar.org:443"
  DATABASE_PROVIDER: "postgresql"
  NODE_ENV: "production"

# ── Secrets (Kubernetes Secret) ─────────────────────────────────────────────
# Sensitive values injected into the container environment at runtime.
# Like config variables, NEXT_PUBLIC_* contract IDs are inlined into client
# bundles at Next.js build time.
secrets:
  DATABASE_URL: ""
  REDIS_URL: ""
  NEXT_PUBLIC_CONTRACT_ID: ""
  NEXT_PUBLIC_EMITTER_CONTRACT_ID: ""

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

nodeSelector: {}
tolerations: []
affinity: {}
