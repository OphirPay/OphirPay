# ------------------------------------------------------------------
# Concurrency: cancel-in-progress for PR workflows
# This workflow runs on pull_request events.
# ------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Contract Regression

on:
  pull_request:
    paths:
      - 'contracts/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Run contract tests
        run: cargo test --manifest-path contracts/ophirpay/Cargo.toml
