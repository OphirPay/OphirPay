name: Prometheus Alerts Validation

on:
  push:
    branches: [integration/staging]
  pull_request:
    branches: [integration/staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install promtool
        run: |
          PROM_VERSION="2.52.0"
          curl -L https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz | tar xz
          sudo mv prometheus-${PROM_VERSION}.linux-amd64/promtool /usr/local/bin/promtool

      - name: Run promtool check rules
        run: promtool check rules monitoring/prometheus-alerts.yml

      - name: Validate metric references
        run: npm run validate-prometheus-metrics
