version: 2

# Issue #1415 — Grouped dependency updates to reduce maintainer PR noise.
#
# Bundles minor and patch updates into logical groups while leaving major
# version bumps on individual PRs for manual evaluation.
# Security advisories automatically bypass grouped version updates and land as
# individual high-priority PRs.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "next"
          - "next-*"
          - "react"
          - "react-*"
          - "@types/react"
          - "@types/react-*"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "prettier"
          - "prettier-*"
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
          - "typescript"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
      utilities:
        patterns:
          - "zod"
          - "date-fns"
          - "clsx"
          - "tailwind-merge"
          - "lucide-react"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/ophirpay"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/emitter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-sdk:
        patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"
      rust-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "soroban-*"
          - "stellar-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
