      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook deleted
          content:
            application/json:
              example:
                success: true
                data:
                  id: wh_019a99824c
                  deleted: true
                  deletedAt: "2026-08-26T19:15:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/webhooks/{id}:
    get:
      tags:
        - Webhooks
      summary: Get a single webhook (secret redacted)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook details (signing secret redacted)
          content:
            application/json:
              example:
                success: true
                data:
                  id: wh_019a99824c
                  url: https://backend.example.com/api/webhooks/ophirpay
                  events:
                    - payment.completed
                    - payment.failed
                  isActive: true
                  createdAt: "2026-08-26T19:05:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/webhooks/{id}/test:
    post:
      tags:
        - Webhooks
      summary: Send a test webhook delivery
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test event delivered
          content:
            application/json:
              example:
                delivered: true
                status: delivered
                event: payment.completed
                test: true
                durationMs: 145
                sentAt: "2026-08-26T19:15:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/webhooks/{id}/replay:
    post:
      tags:
        - Webhooks
      summary: Replay stored webhook events within a bounded date range
      description: |
        Re-delivers stored events from the last 7 days (max 100 per request).
        Each replay attempt is recorded as a delivery for dashboard visibility.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                since:
                  type: string
                  format: date-time
                  description: Start of replay window (clamped to last 7 days)
                until:
                  type: string
                  format: date-time
                  description: End of replay window (defaults to now)
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Max events to replay (default 50)
            example:
              since: "2026-08-25T00:00:00.000Z"
              until: "2026-08-26T00:00:00.000Z"
              limit: 50
      responses:
        "200":
          description: Replay summary with delivery counts
          content:
            application/json:
              example:
                success: true
                data:
                  replayedCount: 12
                  successfulCount: 12
                  failedCount: 0
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/webhooks/{id}/deliveries:
    get:
      tags:
        - Webhooks
      summary: List delivery history for a webhook
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Delivery history (original + replay attempts)
          content:
            application/json:
              example:
                success: true
                data:
                  - id: del_01884abc
                    webhookId: wh_019a99824c
                    event: payment.completed
                    statusCode: 200
                    success: true
                    durationMs: 110
                    attemptedAt: "2026-08-26T19:10:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/webhooks/{id}/deliveries/{deliveryId}/redeliver:
    post:
      tags:
        - Webhooks
      summary: Redeliver a webhook payload from a prior delivery
      description: |
        Re-sends the stored payload from the original event associated with a
        prior delivery and records a new delivery row for dashboard
        visibility.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New delivery recorded and attempted
          content:
            application/json:
              example:
                success: true
                data:
                  id: del_01884abd
                  previousDeliveryId: del_01884abc
                  statusCode: 200
                  success: true
                  attemptedAt: "2026-08-26T19:20:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/keys:
    get:
      tags:
        - API Keys
      summary: List API keys (hashes hidden)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: API key list (id, name, prefix, scopes, timestamps)
          content:
            application/json:
              example:
                success: true
                data:
                  - id: key_01hv89q7a4mpx3n
                    name: Production Backend Worker
                    prefix: oph_8f7b2c9e4a1d
                    scopes:
                      - payments:read
                      - payments:write
                      - webhooks:manage
                    lastUsed: "2026-08-26T18:05:00.000Z"
                    createdAt: "2026-08-26T18:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - API Keys
      summary: Generate a new API key (raw key shown once)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Label for this key
                scopes:
                  type: array
                  description: |
                    Permitted scopes for the key. Allowed values: read:payments, write:payments, read:analytics, admin. The admin scope grants all scopes. Empty means no access.
                  items:
                    type: string
                    enum:
                      - read:payments
                      - write:payments
                      - read:analytics
                      - admin
            example:
              name: Production Backend Worker
              scopes:
                - payments:read
                - payments:write
                - webhooks:manage
      responses:
        "201":
          description: Key generated — store the raw key immediately
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      prefix:
                        type: string
                      scopes:
                        type: array
                        items:
                          type: string
                      key:
                        type: string
                        description: Raw API key — shown only once
              example:
                success: true
                data:
                  id: key_01hv89q7a4mpx3n
                  name: Production Backend Worker
                  prefix: oph_8f7b2c9e4a1d
                  scopes:
                    - payments:read
                    - payments:write
                    - webhooks:manage
                  key: oph_8f7b2c9e4a1d0f62b8e3c1a93817f39a48b021ef9a7c3d2e
        "400":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - API Keys
      summary: Update the scopes of an existing API key
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - scopes
              properties:
                id:
                  type: string
                  description: API key ID to update
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - read:payments
                      - write:payments
                      - read:analytics
                      - admin
            example:
              id: key_01hv89q7a4mpx3n
              scopes:
                - payments:read
      responses:
        "200":
          description: Scopes updated
          content:
            application/json:
              example:
                success: true
                data:
                  id: key_01hv89q7a4mpx3n
                  scopes:
                    - payments:read
        "400":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - API Keys
      summary: Revoke an API key
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              example:
                message: API key revoked successfully.
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/keys/stats:
    get:
      tags:
        - API Keys
      summary: API key usage statistics
      description: |
        Aggregated request counts per API key over the chosen window
        (24h / 7d / 30d), alongside each key's metadata and last-used time.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
            default: 30d
      responses:
        "200":
          description: Per-key usage stats for the window
          content:
            application/json:
              example:
                success: true
                data:
                  window: 24h
                  totalRequests: 8420
                  activeKeys: 4
                  usageByKey:
                    - id: key_01hv89q7a4mpx3n
                      name: Production Backend Worker
                      requests: 7910
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/session:
    post:
      tags:
        - Session
      summary: Issue a signed session cookie for a connected wallet
      description: |
        Called by the UI after a successful wallet connect. Sets an HttpOnly
        HMAC-signed session cookie carrying the wallet public key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - publicKey
                - signature
              properties:
                publicKey:
                  type: string
                  description: Stellar wallet public key
                signature:
                  type: string
                  description: Wallet-signed payload proving ownership
            example:
              publicKey: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
              signature: c3ab41d9e2b10a9c8f7e6d5c4b3a210f9e8d7c6b5a412039485761a2b3c4d5e6f7
      responses:
        "200":
          description: Session cookie issued
          content:
            application/json:
              example:
                success: true
                data:
                  authenticated: true
                  publicKey: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                  issuedAt: "2026-08-26T18:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Session
      summary: Revoke the session cookie
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              example:
                authenticated: false
                message: Session revoked
  /api/auth/challenge:
    get:
      tags:
        - Session
      summary: Mint a proof-of-ownership challenge for a wallet
      description: |
        Returns a short-lived, server-signed challenge plus the exact message
        the wallet must sign. `POST /api/auth/session` only issues a session
        cookie when the signature over this message verifies against the
        public key.
      parameters:
        - name: publicKey
          in: query
          required: true
          schema:
            type: string
            description: Stellar wallet public key (G...)
      responses:
        "200":
          description: Challenge minted
          content:
            application/json:
              schema:
                type: object
                required:
                  - challenge
                  - message
                  - expiresIn
                properties:
                  challenge:
                    type: string
                    description: Single-use challenge token
                  message:
                    type: string
                    description: Exact message the wallet must sign
                  expiresIn:
                    type: integer
                    description: Challenge lifetime in seconds
              example:
                challenge: chl_98234ab1c09d8e7f
                message: "Sign this message to authenticate with OphirPay: chl_98234ab1c09d8e7f"
                expiresIn: 300
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/csrf:
    get:
      tags:
        - Session
      summary: Mint a CSRF token for this session
      description: |
        Sets the HttpOnly `__Host-csrf` cookie AND returns the token in the
        body so clients can echo it via the `x-csrf-token` header on mutation
        requests (double-submit cookie pattern).
      responses:
        "200":
          description: CSRF token issued
          content:
            application/json:
              example:
                success: true
                data:
                  csrfToken: csrf_019a88f24bc910ae
                  headerName: x-csrf-token
  /api/multisig:
    get:
      tags:
        - Multisig
      summary: Get current multisig configuration
      responses:
        "200":
          description: Multisig config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      threshold:
                        type: integer
                      signers:
                        type: array
                        items:
                          type: string
                      enabled:
                        type: boolean
              example:
                success: true
                data:
                  threshold: 2
                  signers:
                    - GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                    - GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                    - GCKIK6UJJ5GDRV47Z2P3N2V376P5Y4G6Z66N2BJZP3M2M2N2M2N2M2N2
                  enabled: true
    post:
      tags:
        - Multisig
      summary: Configure multisig (owner-only on-chain)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                threshold:
                  type: integer
                signers:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
            example:
              threshold: 2
              signers:
                - GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                - GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                - GCKIK6UJJ5GDRV47Z2P3N2V376P5Y4G6Z66N2BJZP3M2M2N2M2N2M2N2
              enabled: true
      responses:
        "201":
          description: Multisig configured
          content:
            application/json:
              example:
                success: true
                data:
                  threshold: 2
                  signers:
                    - GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                    - GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                    - GCKIK6UJJ5GDRV47Z2P3N2V376P5Y4G6Z66N2BJZP3M2M2N2M2N2M2N2
                  enabled: true
  /api/multisig/propose:
    post:
      tags:
        - Multisig
      summary: Propose a payment for multisig approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payee
                - amount
              properties:
                payee:
                  type: string
                amount:
                  type: number
                assetCode:
                  type: string
                memo:
                  type: string
            example:
              payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
              amount: 1000
              assetCode: USDC
              memo: MULTISIG-PAY-01
      responses:
        "201":
          description: Proposal created
          content:
            application/json:
              example:
                success: true
                data:
                  proposalId: 1
                  requiredSignatures: 2
                  currentSignatures: 1
                  status: PENDING_APPROVAL
                  proposer: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                  createdAt: "2026-08-26T19:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/multisig/approve:
    post:
      tags:
        - Multisig
      summary: Approve a pending multisig proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requestId
              properties:
                requestId:
                  type: integer
            example:
              requestId: 1
      responses:
        "200":
          description: Proposal approved
          content:
            application/json:
              example:
                success: true
                data:
                  requestId: 1
                  approvals: 2
                  threshold: 2
                  readyToExecute: true
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/multisig/execute:
    post:
      tags:
        - Multisig
      summary: Execute a fully approved multisig payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requestId
              properties:
                requestId:
                  type: integer
            example:
              requestId: 1
      responses:
        "200":
          description: Payment executed
          content:
            application/json:
              example:
                success: true
                data:
                  requestId: 1
                  status: EXECUTED
                  transactionHash: 8f33190e21a8b94ec174591a2bc0d8e12a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d
  /api/multisig/requests:
    get:
      tags:
        - Multisig
      summary: List pending approval requests
      responses:
        "200":
          description: Pending requests list
          content:
            application/json:
              example:
                success: true
                data:
                  - requestId: 1
                    payee: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
                    amount: 1000
                    assetCode: USDC
                    approvals: 1
                    threshold: 2
                    executed: false
  /api/governance/proposals:
    get:
      tags:
        - Governance
      summary: List governance proposals (most recent first)
      description: |
        Enumerates the contract's proposals, capped at the 100 most recent to
        bound the N+1 on-chain read cost. `truncated` is true when the chain
        holds more proposals than the cap, so callers know the list is partial.
      responses:
        "200":
          description: Proposals list with total and truncation signal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            description:
                              type: string
                            action_type:
                              type: string
                            yes_votes:
                              type: integer
                            no_votes:
                              type: integer
                            voting_ends_at:
                              type:
                                - integer
                                - "null"
                            executed:
                              type: boolean
                            proposer:
                              type: string
                      total:
                        type: integer
                        description: Total proposal count on-chain
                      truncated:
                        type: boolean
                        description: True when older proposals were dropped
              example:
                success: true
                data:
                  items:
                    - id: 1
                      title: Reduce Base Fee to 10 BPS
                      description: Proposal to decrease base transfer fee across all payments
                      action_type: update_fee
                      yes_votes: 120000
                      no_votes: 5000
                      voting_ends_at: 1725300000
                      executed: false
                      proposer: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                  total: 1
                  truncated: false
    post:
      tags:
        - Governance
      summary: Create a governance proposal (on-chain)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - proposer
                - title
              properties:
                proposer:
                  type: string
                title:
                  type: string
                description:
                  type: string
                actionType:
                  type: string
                target:
                  type: string
                data:
                  type: string
                depositAsset:
                  type: string
                  description: Stellar asset address for deposit
                depositAmount:
                  type: integer
                  description: Deposit amount (must be >= min_proposal_deposit)
            example:
              proposer: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
              title: Reduce Base Fee to 10 BPS
              description: Proposal to decrease base transfer fee across all payments
              actionType: update_fee
              target: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
              data: 0000000a
              depositAsset: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
              depositAmount: 100000000
      responses:
        "201":
          description: Proposal created
          content:
            application/json:
              example:
                success: true
                data:
                  proposalId: 1
                  title: Reduce Base Fee to 10 BPS
                  status: ACTIVE
                  votingEndsAt: 1725300000
                  createdAt: "2026-08-26T19:00:00.000Z"
  /api/governance/vote:
    post:
      tags:
        - Governance
      summary: Cast a vote on a proposal (on-chain, 1 vote per address)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - voter
                - proposalId
              properties:
                proposalId:
                  type: integer
                voter:
                  type: string
                support:
                  type: boolean
            example:
              proposalId: 1
              voter: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
              support: true
      responses:
        "200":
          description: Vote cast
          content:
            application/json:
              example:
                success: true
                data:
                  proposalId: 1
                  voter: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                  support: true
                  votingPower: 50000
  /api/governance/execute:
    post:
      tags:
        - Governance
      summary: Execute a passed proposal
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposalId
              properties:
                proposalId:
                  type: integer
                  minimum: 1
            example:
              proposalId: 1
      responses:
        "200":
          description: Proposal executed
          content:
            application/json:
              example:
                success: true
                data:
                  proposalId: 1
                  status: EXECUTED
                  transactionHash: 8f33190e21a8b94ec174591a2bc0d8e12a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/analytics:
    get:
      tags:
        - Analytics
      summary: Aggregated payment analytics
      responses:
        "200":
          description: Payment metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalPayments:
                        type: integer
                      completedPayments:
                        type: integer
                      failedPayments:
                        type: integer
                      totalVolume:
                        type: number
                      averageAmount:
                        type: number
                      successRate:
                        type: integer
                      volumeByDay:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            volume:
                              type: number
                            count:
                              type: integer
              example:
                success: true
                data:
                  totalPayments: 3840
                  completedPayments: 3834
                  failedPayments: 6
                  totalVolume: 1428500
                  averageAmount: 372
                  successRate: 99
                  volumeByDay:
                    - date: "2026-08-26"
                      volume: 48200
                      count: 120
  /api/refunds:
    get:
      tags:
        - Refunds
      summary: List refunds or refund analytics
      parameters:
        - name: analytics
          in: query
          schema:
            type: boolean
          description: Return reason-code buckets instead of full refund list
      responses:
        "200":
          description: Refund data
          content:
            application/json:
              example:
                success: true
                data:
                  - id: ref_001948ba
                    paymentId: 1024
                    onChainId: 12
                    amount: 250
                    asset: USDC
                    reason: Product damaged in shipping
                    reasonCode: 1
                    status: COMPLETED
                    createdAt: "2026-08-26T19:00:00.000Z"
    post:
      tags:
        - Refunds
      summary: Persist a refund ledger row after an on-chain request_refund
      description: |
        Called by the UI AFTER the on-chain request_refund transaction succeeds.
        Stores the contract's refund id (`onChainId`, captured from the tx
        return value) so approve/process can later target the right record.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentId
                - amount
              properties:
                paymentId:
                  type: integer
                  description: On-chain payment id
                amount:
                  type: number
                  description: Refund amount in stroops
                asset:
                  type: string
                  default: native
                reason:
                  type: string
                  maxLength: 500
                reasonCode:
                  type: integer
                  minimum: 0
                  maximum: 5
                onChainId:
                  type: integer
                  description: Contract refund id from the tx return value
            example:
              paymentId: 1024
              amount: 2500000000
              asset: USDC
              reason: Product damaged in shipping
              reasonCode: 1
              onChainId: 12
      responses:
        "201":
          description: Refund ledger row created
          content:
            application/json:
              example:
                success: true
                data:
                  id: ref_001948ba
                  paymentId: 1024
                  onChainId: 12
                  amount: 2500000000
                  asset: USDC
                  reason: Product damaged in shipping
                  reasonCode: 1
                  status: REQUESTED
                  createdAt: "2026-08-26T19:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/refunds/{id}:
    patch:
      tags:
        - Refunds
      summary: Update the lifecycle status of a refund ledger row
      description: |
        Mirrors an on-chain transition (approve_refund / process_refund) onto
        the ledger row so the list reflects Request → Approve → Process.
        Owner-scoped — only the row's user can update it.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - APPROVED
                    - PROCESSED
                    - REJECTED
            example:
              status: APPROVED
      responses:
        "200":
          description: Refund status updated
          content:
            application/json:
              example:
                success: true
                data:
                  id: ref_001948ba
                  status: APPROVED
                  updatedAt: "2026-08-26T19:15:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/hooks:
    get:
      tags:
        - Hooks
      summary: List notification hooks
      parameters:
        - name: event_type
          in: query
          schema:
            type: string
          description: Filter by event type
      responses:
        "200":
          description: Hook list
          content:
            application/json:
              example:
                success: true
                data:
                  - id: hk_019a88bc
                    eventType: payment.completed
                    webhookUrl: https://backend.example.com/api/hooks
                    onChainId: 4
                    active: true
                    createdAt: "2026-08-26T19:00:00.000Z"
    post:
      tags:
        - Hooks
      summary: Persist a hook ledger row after an on-chain register_hook
      description: |
        Called by the UI AFTER the on-chain register_hook transaction succeeds.
        Stores the contract's hook id (`onChainId`, captured from the tx return
        value) so Deactivate can later target the right record.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventType
                - webhookUrl
              properties:
                eventType:
                  type: string
                  maxLength: 100
                webhookUrl:
                  type: string
                  format: uri
                onChainId:
                  type: integer
                  description: Contract hook id from the tx return value
            example:
              eventType: payment.completed
              webhookUrl: https://backend.example.com/api/hooks
              onChainId: 4
      responses:
        "201":
          description: Hook ledger row created
          content:
            application/json:
              example:
                success: true
                data:
                  id: hk_019a88bc
                  eventType: payment.completed
                  webhookUrl: https://backend.example.com/api/hooks
                  onChainId: 4
                  active: true
                  createdAt: "2026-08-26T19:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/hooks/{id}:
    patch:
      tags:
        - Hooks
      summary: Deactivate a hook ledger row after an on-chain unregister_hook
      description: Owner-scoped — only the row's user can update it.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
            example:
              active: false
      responses:
        "200":
          description: Hook updated
          content:
            application/json:
              example:
                success: true
                data:
                  id: hk_019a88bc
                  active: false
                  updatedAt: "2026-08-26T19:20:00.000Z"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/audit-log:
    get:
      tags:
        - Audit Log
      summary: Query contract audit log
      description: |
        Offset-paginated audit log with combined, server-side applied filters
        (`actor`, `action`, `resource`, `since`/`until` date range) and stable
        ordering (newest first by default). `total` reflects the filtered set.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: actor
          in: query
          schema:
            type: string
          description: |
            Filter by Stellar address (substring match, case-insensitive). Combine with `action`, `since`, and `until`; all filters compose with `page`/`limit` pagination.
        - name: action
          in: query
          schema:
            type: string
          description: Filter by exact action type (e.g. `payment_recorded`)
        - name: resource
          in: query
          schema:
            type: integer
          description: Filter by the affected entity id (matches target_id)
        - name: since
          in: query
          schema:
            type: string
          description: Inclusive start of the date range — Unix seconds or ISO 8601
        - name: until
          in: query
          schema:
            type: string
          description: Inclusive end of the date range — Unix seconds or ISO 8601
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Result ordering by entry id (newest first by default)
        - name: source
          in: query
          schema:
            type: string
            enum:
              - contract
              - db
              - all
            default: contract
          description: Backing store — on-chain ledger, persisted audit trail, or both
      responses:
        "200":
          description: |
            Paginated audit log entries. Response `meta.total` reflects the filtered result set, so pagination composes with filters.
          content:
            application/json:
              example:
                success: true
                data:
                  - id: audit_88194a
                    actor: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                    action: ESCROW_CREATED
                    target: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
                    timestamp: "2026-08-26T19:00:00.000Z"
                meta:
                  page: 1
                  limit: 10
                  total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/audit-log/sse:
    get:
      tags:
        - Audit Log
      summary: Subscribe to the live audit-log stream
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      description: |
        Server-Sent Events stream that polls the contract audit log every few
        seconds and pushes new entries to connected clients.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                data: {"id":"audit_88194a","action":"ESCROW_CREATED","timestamp":"2026-08-26T19:00:00.000Z"}

  /api/audit-log/export:
    get:
      tags:
        - Audit Log
      summary: Export contract audit log to CSV
      description: |
        Streaming CSV download of the audit log applying the same filters as
        GET /api/audit-log. Rows are streamed chunk-by-chunk from the contract,
        so the full result set is never held in memory.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: actor
          in: query
          schema:
            type: string
          description: Filter by exact Stellar actor address
        - name: action
          in: query
          schema:
            type: string
          description: Filter by exact action type
        - name: resource
          in: query
          schema:
            type: integer
          description: Filter by the affected entity id (matches target_id)
        - name: since
          in: query
          schema:
            type: string
          description: Inclusive start of the date range — Unix seconds or ISO 8601
        - name: until
          in: query
          schema:
            type: string
          description: Inclusive end of the date range — Unix seconds or ISO 8601
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Result ordering by entry id
      responses:
        "200":
          description: CSV attachment
          content:
            text/csv:
              example: |-
                id,actor,action,target,timestamp
                audit_88194a,GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5,ESCROW_CREATED,CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC,2026-08-26T19:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/events:
    get:
      tags:
        - Events
      summary: Subscribe to real-time payment events
      description: |
        Server-Sent Events stream. Polls the Stellar emitter contract every 10 seconds.

        Events:
        - `connected` — stream established
        - `heartbeat` — keep-alive every 15s
        - `payment:created` — new payment detected from emitter contract
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                data: {"type":"payment.completed","id":"pay_98234ab1c09d","amount":150.00,"timestamp":"2026-08-26T18:15:04.000Z"}

  /api/events/history:
    get:
      tags:
        - Events
      summary: Fetch on-chain payment event history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Number of recent events to return
      responses:
        "200":
          description: Recent event history
          content:
            application/json:
              example:
                success: true
                data:
                  - type: payment.completed
                    id: pay_98234ab1c09d
                    timestamp: "2026-08-26T18:15:04.000Z"
  /api/health:
    get:
      tags:
        - Health
      summary: Service health check
      description: Reports per-check status for the database (critical), Stellar RPC and Horizon reachability, Redis (when configured), and configured contract IDs. Returns 200 with status `ok` or `degraded` (only optional checks failing) and 503 with status `down` when the database is unreachable.
      responses:
        "200":
          description: Healthy or degraded (optional checks failing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                success: true
                data:
                  status: ok
                  version: 0.1.0
                  services:
                    database:
                      status: ok
                      latencyMs: 12
                    redis:
                      status: ok
                      latencyMs: 3
                    stellar:
                      network: testnet
                      rpcUrl: https://soroban-testnet.stellar.org
                      horizonUrl: https://horizon-testnet.stellar.org
                      rpc:
                        status: ok
                        latencyMs: 45
                      horizon:
                        status: ok
                        latencyMs: 38
                    contract:
                      id: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
                      status: ok
                  uptime: 12450.5
                meta:
                  timestamp: "2026-08-26T19:10:00.000Z"
        "503":
          description: "Critical dependency unavailable (code: SERVICE_UNAVAILABLE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Critical dependency (database) unavailable
  /api/metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics endpoint
      responses:
        "200":
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
              example: |-
                # HELP http_requests_total Total HTTP requests
                # TYPE http_requests_total counter
                http_requests_total{method="GET",path="/api/health",status="200"} 1420
  /api/cron:
    get:
      tags:
        - Jobs & Cron
      summary: Scheduled-payment execution sweep (Vercel Cron ping)
      description: |
        Executes due scheduled payments. Vercel Cron invokes the GET path
        with the project's `CRON_SECRET` as `Authorization: Bearer` or the
        `x-cron-secret` header; POST runs the same work for external
        schedulers and manual triggering.
      responses:
        "200":
          description: Run summary (picked / executed / failed / skipped)
          content:
            application/json:
              example:
                success: true
                data:
                  picked: 2
                  executed: 2
                  failed: 0
                  skipped: 0
                  timestamp: "2026-08-26T19:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Jobs & Cron
      summary: Run the scheduled-payment sweep manually
      description: Same work as the GET cron ping, for external schedulers.
      responses:
        "200":
          description: Run summary (picked / executed / failed / skipped)
          content:
            application/json:
              example:
                success: true
                data:
                  picked: 2
                  executed: 2
                  failed: 0
                  skipped: 0
                  timestamp: "2026-08-26T19:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/jobs/process-due-recurring:
    post:
      tags:
        - Jobs & Cron
      summary: Claim and execute due recurring schedules
      description: |
        Claims due recurring schedules (atomically, per-schedule) and creates
        the payment for each. Intended for cron / worker invocation with an
        authenticated session.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  description: Max schedules to process this run
            example:
              limit: 10
      responses:
        "200":
          description: Processed run summary
          content:
            application/json:
              example:
                success: true
                data:
                  processed: 5
                  succeeded: 5
                  failed: 0
                  timestamp: "2026-08-26T19:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/pause-state:
    get:
      tags:
        - Contracts
      summary: Contract pause state
      description: |
        Reads the on-chain `is_paused` flag from the payment contract via a
        simulated contract call.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Pause state ({ paused, available })
          content:
            application/json:
              example:
                success: true
                data:
                  paused: false
                  available: true
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key generated from POST /api/keys
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: oph_
      description: Same API key, passed as Bearer token
  schemas:
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        assetCode:
          type: string
        assetIssuer:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        memo:
          type:
            - string
            - "null"
        status:
          type: string
        transactionHash:
          type:
            - string
            - "null"
        idempotencyKey:
          type:
            - string
            - "null"
          description: Per-attempt key; regenerated on every retry
        sourceAccountId:
          type: string
        userId:
          type: string
        batchId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        errorMessage:
          type:
            - string
            - "null"
    PaginatedPayments:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentResponse"
        meta:
          type: object
          description: |
            Keyset mode (default): `limit`, `nextCursor`, `hasMore` (+ `total`
            when `includeTotal=true`). Offset mode (when `page` is passed):
            `page`, `limit`, `total`, `totalPages`, `hasNext`, `hasPrev`.
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            nextCursor:
              type:
                - string
                - "null"
            hasMore:
              type: boolean
    BatchResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - CREATED
            - PROCESSING
            - COMPLETED
            - PARTIALLY_COMPLETED
            - FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        payments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentResponse"
    BulkCancelBatchResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            batchId:
              type: string
            cancelled:
              type: integer
              description: Number of PENDING payments flipped to CANCELLED
            skipped:
              type: integer
              description: Number of already-submitted (non-PENDING) payments left untouched
            total:
              type: integer
              description: Total child payments in the batch
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
    PaginatedBatches:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/BatchResponse"
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            nextCursor:
              type:
                - string
                - "null"
            hasMore:
              type: boolean
    CreatePaymentRequestSchema:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          description: Payment request amount
        assetCode:
          type: string
          default: XLM
        assetIssuer:
          type: string
          description: Issuer account for non-XLM assets
        description:
          type: string
          maxLength: 500
        recipientAddress:
          type: string
          pattern: ^G[A-Z0-9]{55}$
          description: Optional recipient Stellar address
    CreatePaymentRequest:
      type: object
      required:
        - amount
        - sourceAccountId
        - destAddress
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: 0
          description: Payment amount in stroops for XLM, or smallest unit for other assets
        assetCode:
          type: string
          default: XLM
        assetIssuer:
          type: string
          description: Issuer account for non-XLM assets
        description:
          type: string
          maxLength: 200
        memo:
          type: string
          maxLength: 28
        sourceAccountId:
          type: string
          description: Source Stellar account
        destAddress:
          type: string
          pattern: ^G[A-Z0-9]{55}$
          description: Destination Stellar address (56 chars, starts with G)
    CreateBatchRequest:
      type: object
      required:
        - name
        - recipients
        - sourceAccountId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 255
          description: Optional alternative to the Idempotency-Key header (trimmed before validation/storage)
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - address
              - amount
            properties:
              address:
                type: string
                pattern: ^G[A-Z0-9]{55}$
              amount:
                type: number
                minimum: 0
                exclusiveMinimum: 0
              assetCode:
                type: string
                default: XLM
              memo:
                type: string
                maxLength: 28
        sourceAccountId:
          type: string
    CreateRecurrenceRequest:
      type: object
      required:
        - name
        - frequency
        - amount
        - destAddress
        - sourceAccountId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          type: string
          enum:
            - DAILY
            - WEEKLY
            - BIWEEKLY
            - MONTHLY
            - QUARTERLY
            - YEARLY
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: 0
        assetCode:
          type: string
          default: XLM
        destAddress:
          type: string
          pattern: ^G[A-Z0-9]{55}$
        description:
          type: string
          maxLength: 500
        sourceAccountId:
          type: string
    CreateWebhookRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - payment.created
              - payment.signed
              - payment.submitted
              - payment.confirmed
              - payment.completed
              - payment.failed
              - batch.created
              - batch.completed
              - batch.failed
              - recurrence.triggered
              - recurrence.completed
              - recurrence.failed
              - request.created
              - request.paid
              - request.expired
          description: Event types to subscribe to
        isActive:
          type: boolean
          default: true
    TestWebhookResponse:
      type: object
      properties:
        delivered:
          type: boolean
          description: Whether the endpoint returned a 2xx response
        status:
          type: string
          enum:
            - delivered
            - failed
        event:
          type: string
          description: The simulated event type (e.g. payment.completed)
        test:
          type: boolean
          description: Always true — this was a test event
        durationMs:
          type: integer
          description: Round-trip delivery time in milliseconds
        sentAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            version:
              type: string
            status:
              type: string
              enum:
                - ok
                - degraded
                - down
            services:
              type: object
              properties:
                database:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                        - ok
                        - error
                    latencyMs:
                      type:
                        - integer
                        - "null"
                redis:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                        - ok
                        - error
                        - disabled
                    latencyMs:
                      type:
                        - integer
                        - "null"
                stellar:
                  type: object
                  properties:
                    network:
                      type: string
                    rpcUrl:
                      type: string
                    horizonUrl:
                      type: string
                    rpc:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - ok
                            - error
                            - unchecked
                        latencyMs:
                          type:
                            - integer
                            - "null"
                    horizon:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - ok
                            - error
                            - unchecked
                        latencyMs:
                          type:
                            - integer
                            - "null"
                    contracts:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - ok
                            - error
                        ophirpay:
                          type: object
                          properties:
                            id:
                              type:
                                - string
                                - "null"
                            status:
                              type: string
                              enum:
                                - ok
                                - error
                                - not_configured
                        emitter:
                          type: object
                          properties:
                            id:
                              type:
                                - string
                                - "null"
                            status:
                              type: string
                              enum:
                                - ok
                                - error
                                - not_configured
                        chainReadSource:
                          type: object
                          properties:
                            id:
                              type:
                                - string
                                - "null"
                            status:
                              type: string
                              enum:
                                - ok
                                - error
                                - not_configured
            uptime:
              type: number
        meta:
          type: object
          properties:
            timestamp:
              type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    ValidationError:
      description: "Invalid request data (code: VALIDATION_ERROR)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: "Invalid request payload: destination address is required"
    NotFound:
      description: "Resource not found (code: NOT_FOUND)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Requested resource was not found
    Unauthorized:
      description: "Missing or invalid API key (code: UNAUTHORIZED)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required. Missing or invalid API key.
    Forbidden:
      description: "Insufficient permissions (code: FORBIDDEN)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Insufficient permissions to perform this action
    Conflict:
      description: "Resource state conflict (code: CONFLICT)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: CONFLICT
              message: Resource already exists or conflicting state transition
    RateLimited:
      description: "Too many requests (code: RATE_LIMITED)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please back off before retrying.
    ServerError:
      description: "Internal server error (code: INTERNAL_ERROR)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An internal server error occurred
    ServiceUnavailable:
      description: "Service temporarily unavailable (code: SERVICE_UNAVAILABLE)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: Service or critical dependency temporarily unavailable
