name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://localhost:5432/ophirpay"
      DATABASE_PROVIDER: "postgresql"
      DIRECT_DATABASE_URL: "postgresql://localhost:5432/ophirpay"
      NEXT_PUBLIC_CONTRACT_ID: "CCQGGUJRRVXMHNEX2RYPODGJE2YRMYY4Y7A3KTJH3QP2LWZLTCOPRPET"
      NEXT_PUBLIC_EMITTER_CONTRACT_ID: "CDAVU2XJ7C2Y52GRJZKRG3HDI7AJ2K2FHAFH5FPDTSUQAV7XNBQNNVAN"
      AUTH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-prisma # node-version-file: '.nvmrc'
      - name: Create .env.local
        run: |
          cp .env.example .env.local
          sed -i 's/AUTH_SECRET=.*/AUTH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' .env.local
      - run: npm run build
      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
