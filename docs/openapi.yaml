openapi: 3.0.3
info:
  title: OphirPay API
  version: 1.0.0
paths:
  /api/payments:
    post:
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            examples:
              valid:
                value:
                  amount: "1000000000000000000"
                  currency: "USDC"
                  recipient: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
                  metadata: { key: "value" }
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                success:
                  value:
                    id: "pay_12345"
                    status: "pending"
                    amount: "1000000000000000000"
                    createdAt: "2023-01-01T00:00:00Z"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_amount:
                  value:
                    code: "INVALID_AMOUNT"
                    message: "Amount must be positive"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    code: "UNAUTHORIZED"
                    message: "Invalid API key"
    get:
      summary: List payments
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
              examples:
                success:
                  value:
                    - id: "pay_12345"
                      status: "pending"
                      amount: "1000000000000000000"
                      createdAt: "2023-01-01T00:00:00Z"
  /api/batches:
    post:
      summary: Create a batch payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            examples:
              valid:
                value:
                  payments:
                    - amount: "500000000000000000"
                      currency: "USDC"
                      recipient: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
                  metadata: { key: "batch_1" }
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              examples:
                success:
                  value:
                    id: "batch_67890"
                    status: "pending"
                    paymentCount: 2
                    createdAt: "2023-01-01T00:00:00Z"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                empty_payments:
                  value:
                    code: "EMPTY_PAYMENTS"
                    message: "At least one payment required"
  # ... (remaining 55 paths follow same pattern)
components:
  schemas:
    PaymentRequest:
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
        recipient:
          type: string
        metadata:
          type: object
      required: [amount, currency, recipient]
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        amount:
          type: string
        createdAt:
          type: string
    BatchRequest:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRequest'
        metadata:
          type: object
      required: [payments]
    BatchResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        paymentCount:
          type: integer
        createdAt:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
