name: Scheduled Payments — Cron Sweep

# The scheduled-payment sweep runs via GitHub Actions on a 5-minute schedule
# to invoke the deployed cron endpoints across environments (production & staging).
# Calling the deployed endpoint executes scheduled payments and expires stale requests
# against the isolated database and Stellar network configured for that environment.
#
# Environments:
# - production: Target URL and secrets scoped to the production deployment.
# - staging: Target URL and secrets scoped to integration/staging deployment.
#
# Secrets and Variables per Environment:
# - vars.CRON_BASE_URL (or vars.APP_URL): Base URL of the deployment (e.g. configured in GitHub Environment Variables)
# - secrets.CRON_SECRET: Shared secret matching the deployment's CRON_SECRET env variable.
#
# If CRON_SECRET or CRON_BASE_URL is not set for an environment, the run safely exits
# early with an explanatory warning instead of failing unrelated sweeps.

on:
  schedule:
    # Every 5 minutes — matches the original vercel.json cadence.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to sweep ('all', 'production', or 'staging')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - production
          - staging

permissions:
  contents: read

# -- Global Concurrency — singleton group for scheduled runs --------
concurrency:
  group: ${{ github.workflow }}

jobs:
  run-sweep:
    name: "Execute sweep (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' || inputs.target_environment == 'all' || inputs.target_environment == matrix.environment
    strategy:
      fail-fast: false
      matrix:
        environment:
          - production
          - staging
    environment: ${{ matrix.environment }}
    steps:
      - name: Trigger /api/cron on ${{ matrix.environment }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL || vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not configured for environment '${{ matrix.environment }}' — sweep skipped"
            exit 0
          fi
          if [ -z "$CRON_BASE_URL" ]; then
            echo "::warning::CRON_BASE_URL (or APP_URL) is not configured for environment '${{ matrix.environment }}' — sweep skipped"
            exit 0
          fi
          BASE_URL="${CRON_BASE_URL%/}"
          CRON_URL="${BASE_URL}/api/cron"
          http_code=$(curl -sS -o /tmp/cron-response.json -w "%{http_code}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "$CRON_URL")
          echo "HTTP $http_code"
          cat /tmp/cron-response.json
          echo ""
          # 2xx means the sweep ran; anything else (401 wrong secret,
          # 503 unconfigured) should surface as a failed run.
          [ "${http_code:0:1}" = "2" ]

      - name: Trigger /api/requests/expire on ${{ matrix.environment }}
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL || vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not configured for environment '${{ matrix.environment }}' — request expiry skipped"
            exit 0
          fi
          if [ -z "$CRON_BASE_URL" ]; then
            echo "::warning::CRON_BASE_URL (or APP_URL) is not configured for environment '${{ matrix.environment }}' — request expiry skipped"
            exit 0
          fi
          BASE_URL="${CRON_BASE_URL%/}"
          CRON_URL="${BASE_URL}/api/requests/expire"
          http_code=$(curl -sS -o /tmp/request-expiry-response.json -w "%{http_code}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "$CRON_URL")
          echo "HTTP $http_code"
          cat /tmp/request-expiry-response.json
          echo ""
          [ "${http_code:0:1}" = "2" ]
