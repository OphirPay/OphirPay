name: Kani Formal Verification

on:
  push:
    branches:
      - integration/staging
  pull_request:
    branches:
      - integration/staging

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rust-src
      - name: Install Kani
        run: |
          curl -L https://github.com/model-checking/kani/releases/download/v0.9.0/kani-0.9.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          echo "$PWD/kani-0.9.0/bin" >> $GITHUB_PATH
      - name: Run Kani
        working-directory: contracts/ophirpay/spec
        run: |
          cargo kani --tests -- -Zunstable-options --output-dir=target/kani
      - name: Upload Kani report
        uses: actions/upload-artifact@v4
        with:
          name: kani-report
          path: contracts/ophirpay/spec/target/kani
